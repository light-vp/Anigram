# Publishes the MCP server to npm as `anigram-mcp`, only when a maintainer
# pushes a tag like `mcp-v0.2.0` whose version matches mcp/package.json.
# Nothing else triggers it. There is no npm token: npm's Trusted Publishing
# lets this workflow publish by proving, over OIDC, that it is this repo's
# run, once the package names it as its trusted publisher. See RELEASING.md.
name: Publish anigram-mcp

on:
  push:
    tags:
      - 'mcp-v*'

permissions:
  contents: read
  # the OIDC token npm's Trusted Publishing checks; it also signs provenance
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs npm 11.5.1 or later
      - name: Update npm
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      - name: The tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./mcp/package.json').version")
          if [ "$TAG" != "mcp-v$version" ]; then
            echo "tag $TAG does not match mcp/package.json version $version" >&2
            exit 1
          fi

      - name: Typecheck, lint, test
        run: npm run typecheck && npm run lint && npm test

      - name: Build and drive the server over stdio
        run: npm run test:mcp

      - name: Publish
        working-directory: mcp
        run: npm publish --access public
