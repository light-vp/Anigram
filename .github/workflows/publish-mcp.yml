# Publishes the MCP server to npm as `anigram-mcp`, only when a maintainer
# pushes a tag like `mcp-v0.2.0` whose version matches mcp/package.json.
# Nothing else triggers it. There is no npm token: npm's Trusted Publishing
# lets this workflow stage a release by proving, over OIDC, that it is this
# repo's run. A staged version is not live until a maintainer approves it on
# npmjs.com (or `npm stage approve`) with 2FA. See RELEASING.md.
name: Publish anigram-mcp

on:
  push:
    tags:
      - 'mcp-v*'

permissions:
  contents: read
  # the OIDC token npm's Trusted Publishing checks; it also signs provenance
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      # staged publishing needs npm 11.15.0 or later
      - name: Update npm
        run: npm install -g npm@^11.15.0

      - name: Install dependencies
        run: npm ci

      - name: The tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./mcp/package.json').version")
          if [ "$TAG" != "mcp-v$version" ]; then
            echo "tag $TAG does not match mcp/package.json version $version" >&2
            exit 1
          fi

      - name: App, package and changelog agree
        run: npm run version:check

      - name: Typecheck, lint, test
        run: npm run typecheck && npm run lint && npm test

      - name: Build and drive the server over stdio
        run: npm run test:mcp

      # stages the version; it goes live only when a maintainer approves it
      - name: Stage the release
        working-directory: mcp
        run: npm stage publish --access public
