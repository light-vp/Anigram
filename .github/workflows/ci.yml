# Every check a change has to pass. Deploying is deploy.yml's job, on merge.
name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Versions agree
        run: npm run version:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: MCP server (build, then drive it over stdio)
        run: npm run test:mcp

      - name: Reference docs are up to date
        run: npm run docs:check

      # the portfolio still embeds a copy built with a relative base
      - name: Build with a relative base
        run: npm run build -- --base=./

  # The app in a real browser. Runs in Playwright's own image, pinned to the
  # same version as package.json, so the browser and its fonts are identical
  # on every run and the sheet screenshots can be compared pixel for pixel.
  browser:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.56.1-noble

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Browser tests and screenshots
        run: npm run e2e

      # on a failure: the trace of each failed test, and the screenshot diffs
      - name: Keep the browser test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-report
          path: |
            e2e/report
            e2e/results
          retention-days: 14
