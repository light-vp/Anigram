# Every check a change has to pass. Deploying is deploy.yml's job, on merge.
name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Versions agree
        run: npm run version:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: MCP server (build, then drive it over stdio)
        run: npm run test:mcp

      - name: Reference docs are up to date
        run: npm run docs:check

      # the portfolio still embeds a copy built with a relative base
      - name: Build with a relative base
        run: npm run build -- --base=./

      # the browser tests drive the root-based build, as deployed
      - name: Build for the browser tests
        run: npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests and screenshots
        run: npm run e2e

      # on a failure: the trace of each failed test, and the screenshot diffs
      - name: Keep the browser test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-report
          path: |
            e2e/report
            e2e/results
          retention-days: 14
