<?xml version="1.0" encoding="UTF-8"?>
<svg width="920" height="608" class="sheet" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 608" style="--paper:#ffffff;--line:#e3e3e1;--tile:#fafaf9;--ink:#18181b;--muted:#8a8a87;--lit:#f5b301;--alarm:#e5484d;--light:#f5b301;--electric:#f08c00;--water:#2f7cf6;--heat:#e5484d;--fuel:#12a594;--mechanical:#71717a;--data:#7c5cf0;--oil:#b4651e;--air:#0f9fbf" role="img" aria-label="A garden that waters itself: Cause and effect, one link at a time: sunlight starts a pump, a float stops it, a timer opens the sprinkler"><style>
.sheet { font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
.ln { fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
.ln.thin, .thin { stroke-width: 1; }
.ln.solid { fill: var(--tile); }
.inkf { fill: var(--ink); }
.puff { fill: none; stroke: var(--muted); stroke-width: 1; }
.win { fill: none; stroke: var(--ink); stroke-width: 0.9; }
.win.on { fill: var(--lit); stroke: var(--lit); }
.bar { fill: var(--paper); stroke: var(--ink); stroke-width: 1.5; }
.glyphText { font-size: 12px; font-weight: 600; fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
.glyphText.small { font-size: 8.5px; }

.bg { fill: var(--paper); }

.part .tile { fill: var(--tile); stroke: var(--line); stroke-width: 1; transition: stroke 0.2s; }
.part.bad .tile { stroke: var(--alarm); }
.part:hover .tile { stroke: var(--muted); }
.part.selected .tile { stroke: var(--ink); stroke-width: 1.5; }
.part .hit { fill: transparent; }
.part.selectable .hit { cursor: pointer; }
.dim { opacity: 0.18; }
.part, .link, .tagGroup, .labelGroup { transition: opacity 0.25s; }

.label, .value, .tag { paint-order: stroke; stroke: var(--paper); stroke-width: 4px; stroke-linejoin: round; }
.label { font-size: 11.5px; font-weight: 550; fill: var(--ink); }
.value { font-size: 10.5px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.value.bad { fill: var(--alarm); }
.chainArrow { fill: none; stroke: var(--muted); stroke-width: 1.25; stroke-dasharray: 3 4; opacity: 0.55; }
.chainArrow.live { stroke: var(--lit); opacity: 1; stroke-dasharray: none; stroke-width: 1.75; }
.chainRing { fill: none; stroke: var(--lit); stroke-width: 2; }

.route { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.route.loss { stroke-dasharray: 1 5; stroke-width: 1.5; stroke: var(--muted); opacity: 0.6; }
.route.limit { stroke: var(--alarm); }
.stream { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.chev { fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.tag { font-size: 10px; fill: var(--muted); text-anchor: middle; dominant-baseline: central; font-variant-numeric: tabular-nums; }

.title { font-size: 20px; font-weight: 600; letter-spacing: -0.015em; fill: var(--ink); }
.sub { font-size: 12.5px; fill: var(--muted); }
.clock { font-size: 20px; font-weight: 500; fill: var(--ink); text-anchor: end; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.meta { font-size: 11px; fill: var(--muted); text-anchor: end; letter-spacing: 0.02em; }
.legend { font-size: 11px; fill: var(--muted); dominant-baseline: central; }
.credit { font-size: 10px; fill: var(--muted); text-anchor: end; letter-spacing: 0.02em; }
.rule { stroke: var(--line); stroke-width: 1; }
</style><rect class="bg" width="920" height="608"></rect><g><text class="title" x="40" y="38">A garden that waters itself</text><text class="sub" x="40" y="58"><tspan x="40" dy="0">Cause and effect, one link at a time: sunlight starts a pump, a float stops it, a</tspan><tspan x="40" dy="16">timer opens the sprinkler</tspan></text><text class="clock" x="880" y="38">06:00</text><text class="meta" x="880" y="58">LD-006 · day 1</text></g><g><g class="link"><title>Sun → Solar panel: 0 kW of sunlight</title><path d="M100 264 L220 264" class="route"></path></g><g class="link"><title>Solar panel → Shed board: 0 kW of electricity</title><path d="M220 264 L340 264" class="route"></path></g><g class="link"><title>Shed board → Battery: 0 kW of electricity</title><path d="M345 264 L345 144" class="route"></path></g><g class="link"><title>Battery → Shed board: 0 kW of electricity</title><path d="M335 144 L335 264" class="route"></path></g><g class="link"><title>Shed board → House lights: 0 kW of electricity</title><path d="M340 264 L562 264 Q580 264 580 246 L580 144" class="route"></path></g><g class="link"><title>Shed board → Pump: 0 kW of electricity</title><path d="M340 264 L340 306 Q340 324 358 324 L442 324 Q460 324 460 342 L460 384" class="route"></path></g><g class="link"><title>Well → Pump: 0 m³/h of water</title><path d="M460 504 L460 384" class="route"></path></g><g class="link"><title>Pump → Header tank: 0 m³/h of water</title><path d="M460 384 L580 384" class="route"></path></g><g class="link"><title>Header tank → Timer valve: 0 m³/h of water</title><path d="M580 384 L700 384" class="route"></path></g><g class="link"><title>Timer valve → Sprinkler: 0 m³/h of water (limit 4.0 m³/h)</title><path d="M700 384 L820 384" class="route"></path></g><g class="chain" aria-hidden="true"><defs><marker id="chain-head" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L7,4 L1,7" fill="none" stroke="context-stroke"></path></marker></defs><path class="chainArrow" d="M616,384 Q640,358 664,384" marker-end="url(#chain-head)"></path></g></g><g><g class="part selectable" transform="translate(100 264)"><title>Sun
Sunlight on the shed roof. Drag the cloud slider and watch the whole chain wait for it.</title><rect class="tile" x="-26" y="-26" width="52" height="52" rx="14"></rect><path class="ln" d="M5 -12 A 12 12 0 1 0 12 5 A 9 9 0 0 1 5 -12 Z"></path><rect class="hit" x="-26" y="-26" width="52" height="52"></rect></g><g class="part selectable" transform="translate(220 264)"><title>Solar panel
A fifth of the light becomes electricity. It is also the chain’s alarm clock.</title><rect class="tile" x="-26" y="-26" width="52" height="52" rx="14"></rect><g><path d="M-15 -9 H10 L15 5 H-10 Z" fill="var(--light)" opacity="0"></path><path class="ln" d="M-15 -9 H10 L15 5 H-10 Z M-12.5 -2 H12.5 M-6.7 -9 L-1.7 5 M1.7 -9 L6.7 5 M0 5 V14 M-6 14 H6"></path></g><rect class="hit" x="-26" y="-26" width="52" height="52"></rect></g><g class="part selectable" transform="translate(340 264)"><title>Shed board</title><g><rect x="-30" y="-3" width="60" height="6" rx="3" class="bar"></rect><line x1="-26" x2="26" stroke="var(--electric)" stroke-width="2" stroke-linecap="round" opacity="0"></line></g><rect class="hit" x="-26" y="-14" width="52" height="28"></rect></g><g class="part selectable" transform="translate(580 144)"><title>House lights
Dusk turns them on: the last link of the chain.
Click to switch it on or off.</title><rect class="tile" x="-26" y="-26" width="52" height="52" rx="14"></rect><g><path class="ln" d="M-14 0 L0 -13 L14 0 M-10 -3.5 V14 H10 V-3.5"></path><path class="ln" d="M-2.5 14 V8 H2.5 V14"></path><rect x="-6.8" y="-0.8" width="3.6" height="3.6" rx="0.6" class="win"></rect><rect x="3.2" y="-0.8" width="3.6" height="3.6" rx="0.6" class="win"></rect></g><rect class="hit" x="-26" y="-26" width="52" height="52"></rect></g><g class="part selectable" transform="translate(460 504)"><title>Well</title><rect class="tile" x="-26" y="-26" width="52" height="52" rx="14"></rect><g><path class="ln" d="M-16 -7 H-4 M4 -7 H16 M-3 -16 V15 M3 -16 V15"></path><path class="ln thin" d="M-14 -7 l-3 4 M-9 -7 l-3 4 M9 -7 l-3 4 M14 -7 l-3 4"></path><clipPath id="clipR6qm"><rect x="-16" y="6" width="32" height="8"></rect></clipPath><g clip-path="url(#clipR6qm)"><path class="ln" stroke="var(--water)" opacity="0.49" d="M-22 10 q 1.5 -2 3 0 t 3 0 t 3 0 t 3 0 t 3 0 t 3 0 t 3 0 t 3 0 t 3 0 t 3 0 t 3 0 t 3 0 t 3 0 t 3 0"></path></g></g><rect class="hit" x="-26" y="-26" width="52" height="52"></rect></g><g class="part selectable" transform="translate(460 384)"><title>Pump
Only runs on sunshine, and only when the chain says so.
Click to switch it on or off.</title><rect class="tile" x="-26" y="-26" width="52" height="52" rx="14"></rect><g><path class="ln" d="M-7 9 L-10 15 H10 L7 9 M0 -11 H15"></path><circle r="11" class="ln"></circle><g transform="rotate(0)" class="ln"><path transform="rotate(0)" d="M0 -2 Q 4 -4 5 -8"></path><path transform="rotate(120)" d="M0 -2 Q 4 -4 5 -8"></path><path transform="rotate(240)" d="M0 -2 Q 4 -4 5 -8"></path></g></g><rect class="hit" x="-26" y="-26" width="52" height="52"></rect></g><g class="part selectable" transform="translate(580 384)"><title>Header tank
