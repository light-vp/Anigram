r="middle">Sprinkler</text><text class="value" text-anchor="middle" y="14">off</text></g></g><g></g><g><g><line x1="40" y1="582" x2="52" y2="582" stroke="var(--light)" stroke-width="3" stroke-linecap="round"></line><text class="legend" x="60" y="582">sunlight · kW</text></g><g><line x1="162.60000000000002" y1="582" x2="174.60000000000002" y2="582" stroke="var(--electric)" stroke-width="3" stroke-linecap="round"></line><text class="legend" x="182.60000000000002" y="582">electricity · kW</text></g><g><line x1="303.8" y1="582" x2="315.8" y2="582" stroke="var(--water)" stroke-width="3" stroke-linecap="round"></line><text class="legend" x="323.8" y="582">water · m³/h</text></g></g><a href="https://anigram.vaibhav.co.uk" target="_blank" rel="noopener"><text class="credit" x="880" y="586">Made with Anigram · Vaibhav Patel</text></a></svg>