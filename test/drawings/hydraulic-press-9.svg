A double-acting cylinder; its piston and rod follow its fill
Oil into the cap end drives the ram out; oil out of it brings the ram back. Its fill is how far out the ram is.</title><g><g><path class="ln" d="M-14 8 V13 M10 8 V13"></path><rect x="-18" y="-8" width="32" height="16" class="ln sym"></rect><rect x="-18" y="-8" width="28" height="16" class="lvl oil"></rect><rect x="-18" y="-8" width="32" height="16" class="ln"></rect><rect x="11.5" y="-2" width="31.5" height="4" class="ln sym"></rect><rect x="8.5" y="-8" width="3" height="16" class="inkf"></rect></g></g><rect class="hit" x="-26" y="-26" width="52" height="52"></rect></g><g class="part selectable" transform="translate(580 264)"><title>1V1 Directional valve
A 4/3 directional valve, closed centre, solenoids and centring springs; its open picks the envelope: 0 the centre, 0.5 crossed (P to B), 1 straight through (P to A)
Solenoid a sends the pump to the cap end, solenoid b lets the cap end back to tank, and in the centre everything is shut. Click it to stop or start the cycle.
Click to switch it on or off.</title><g><g><path class="ln" d="M-4 -8 V-13 M4 -8 V-13 M-4 8 V13 M4 8 V13"></path><g transform="translate(0 0)"><g transform="translate(-16 0)"><rect x="-8" y="-8" width="16" height="16" class="ln sym"></rect><g><path class="ln thin" d="M-4 8 L-4 -4.4"></path><path class="inkf" d="M-4 -8 L-2.02 -4.4 L-5.98 -4.4 Z"></path></g><g><path class="ln thin" d="M4 -8 L4 4.4"></path><path class="inkf" d="M4 8 L2.02 4.4 L5.98 4.4 Z"></path></g></g><g transform="translate(0 0)"><rect x="-8" y="-8" width="16" height="16" class="ln sym"></rect><path class="ln thin" d="M-4 -8 V-4.5 M-6.5 -4.5 H-1.5 M4 -8 V-4.5 M1.5 -4.5 H6.5 M-4 8 V4.5 M-6.5 4.5 H-1.5 M4 8 V4.5 M1.5 4.5 H6.5"></path></g><g transform="translate(16 0)"><rect x="-8" y="-8" width="16" height="16" class="ln sym"></rect><g><path class="ln thin" d="M-4 8 L2.39 -4.78"></path><path class="inkf" d="M4 -8 L4.16 -3.89 L0.62 -5.67 Z"></path></g><g><path class="ln thin" d="M-4 -8 L2.39 4.78"></path><path class="inkf" d="M4 8 L0.62 5.67 L4.16 3.89 Z"></path></g></g><path class="ln thin" d="M-30 0 L-31 -4 L-33 4 L-35 -4 L-37 4 L-38 0"></path><path class="ln thin" d="M30 0 L31 -4 L33 4 L35 -4 L37 4 L38 0"></path><g><rect x="-30" y="-5" width="6" height="10" class="ln sym"></rect><path class="ln thin" d="M-30 5 L-24 -5"></path></g><g><rect x="24" y="-5" width="6" height="10" class="ln sym"></rect><path class="ln thin" d="M24 5 L30 -5"></path></g></g></g></g><rect class="hit" x="-26" y="-26" width="52" height="52"></rect></g><g class="part selectable" transform="translate(700 384)"><title>Tank
