<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">
  <rect width="1100" height="520" fill="#fff"/>
  <text x="550" y="28" font-size="16" font-weight="bold">P&amp;ID - Tank T-101 to Day Tank T-102 Transfer System</text>

  <!-- Process piping -->
  <g stroke="#000" stroke-width="3" fill="none">
    <line x1="150" y1="380" x2="350" y2="380"/>
    <line x1="410" y1="380" x2="900" y2="380"/>
  </g>
  <polygon points="300,380 292,375 292,385" fill="#000"/>
  <polygon points="840,380 832,375 832,385" fill="#000"/>

  <!-- T-101 -->
  <g stroke="#000" stroke-width="2" fill="#f4f4f4">
    <rect x="60" y="200" width="120" height="200"/>
  </g>
  <text x="120" y="295" font-size="14" font-weight="bold">T-101</text>
  <text x="120" y="312">Storage tank</text>
  <line x1="60" y1="360" x2="180" y2="360" stroke="#000" stroke-dasharray="2 3"/>

  <!-- T-102 -->
  <rect x="900" y="200" width="120" height="200" stroke="#000" stroke-width="2" fill="#f4f4f4"/>
  <text x="960" y="295" font-size="14" font-weight="bold">T-102</text>
  <text x="960" y="312">Day tank</text>

  <!-- HV-101 suction isolating valve -->
  <g stroke="#000" stroke-width="2" fill="#fff">
    <polygon points="230,370 260,390 260,370 230,390"/>
  </g>
  <text x="245" y="412">HV-101</text>
  <text x="245" y="425">Suction isolation</text>

  <!-- P-101 -->
  <circle cx="380" cy="380" r="30" stroke="#000" stroke-width="2" fill="#fff"/>
  <polygon points="380,350 410,380 380,380" fill="none" stroke="#000" stroke-width="2" transform="rotate(0)"/>
  <text x="380" y="432">P-101</text>
  <text x="380" y="445">Transfer pump</text>

  <!-- NRV-101 check valve -->
  <g stroke="#000" stroke-width="2" fill="#fff">
    <circle cx="475" cy="380" r="13"/>
  </g>
  <polygon points="470,372 470,388 482,380" fill="#000"/>
  <line x1="483" y1="372" x2="483" y2="388" stroke="#000" stroke-width="2"/>
  <text x="475" y="412">NRV-101</text>
  <text x="475" y="425">Check valve</text>

  <!-- HV-102 discharge isolating valve -->
  <polygon points="545,370 575,390 575,370 545,390" stroke="#000" stroke-width="2" fill="#fff"/>
  <text x="560" y="412">HV-102</text>
  <text x="560" y="425">Discharge isolation</text>

  <!-- LV-102 control valve -->
  <polygon points="665,370 695,390 695,370 665,390" stroke="#000" stroke-width="2" fill="#fff"/>
  <line x1="680" y1="380" x2="680" y2="352" stroke="#000" stroke-width="2"/>
  <path d="M662,352 A18,18 0 0 1 698,352 Z" stroke="#000" stroke-width="2" fill="#fff"/>
  <text x="680" y="412">LV-102</text>
  <text x="680" y="425">Level control valve</text>

  <!-- Instruments (circles; line through = field/DCS shared not used, plain field/panel) -->
  <g stroke="#000" stroke-width="1.5" fill="#fff">
    <circle cx="260" cy="240" r="24"/>
    <circle cx="380" cy="140" r="24"/>
    <circle cx="380" cy="250" r="24"/>
    <circle cx="820" cy="250" r="24"/>
    <circle cx="680" cy="190" r="24"/>
  </g>
  <g stroke="#000" stroke-width="1.5">
    <line x1="236" y1="240" x2="284" y2="240" opacity="0"/>
    <line x1="656" y1="190" x2="704" y2="190"/>
  </g>
  <text x="260" y="244">LT-101</text>
  <text x="380" y="144">LAL-101</text>
  <text x="380" y="254">LSL-101</text>
  <text x="820" y="254">LT-102</text>
  <text x="680" y="186">LIC-102</text>
  <text x="680" y="204" font-size="9">controller</text>
  <text x="380" y="108" font-size="10">Low level alarm</text>
  <text x="440" y="275" font-size="10" text-anchor="start">Low level: trip P-101</text>
  <text x="260" y="205" font-size="10">Level transmitter</text>
  <text x="820" y="215" font-size="10">Level transmitter</text>

  <!-- Impulse/sensing connections to tanks -->
  <g stroke="#000" stroke-width="1" fill="none">
    <line x1="180" y1="240" x2="236" y2="240"/>
    <line x1="900" y1="250" x2="844" y2="250"/>
  </g>

  <!-- Signals (dashed) -->
  <g stroke="#000" stroke-width="1.5" stroke-dasharray="6 4" fill="none">
    <line x1="280" y1="224" x2="361" y2="156"/>
    <line x1="284" y1="240" x2="356" y2="248"/>
    <line x1="380" y1="274" x2="380" y2="350"/>
    <line x1="798" y1="244" x2="702" y2="198"/>
    <line x1="680" y1="214" x2="680" y2="334"/>
  </g>
  <polygon points="380,350 375,340 385,340" fill="#000"/>
  <polygon points="680,334 675,324 685,324" fill="#000"/>

  <!-- Notes -->
  <text x="60" y="490" text-anchor="start" font-size="11">LIC-102 compares LT-102 to setpoint and throttles LV-102 in the pump discharge line to hold T-102 level.</text>
  <text x="60" y="506" text-anchor="start" font-size="11">LT-101 low level: LAL-101 alarms and LSL-101 trips P-101 (dry-run protection).</text>
  <g stroke="#000" stroke-width="3"><line x1="800" y1="480" x2="840" y2="480"/></g>
  <text x="850" y="484" text-anchor="start">Process</text>
  <line x1="800" y1="498" x2="840" y2="498" stroke="#000" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="850" y="502" text-anchor="start">Signal</text>
</svg>
