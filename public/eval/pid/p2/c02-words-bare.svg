<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 780" width="1160" height="780" font-family="Arial, sans-serif" font-size="12">
  <defs>
    <pattern id="pack" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 8L8 0M-2 2L2 -2M6 10L10 6" stroke="#666" stroke-width="1"/>
    </pattern>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8z" fill="#000"/></marker>
    <marker id="sarr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8z" fill="#06c"/></marker>
  </defs>
  <rect width="1160" height="780" fill="#fff"/>
  <rect x="10" y="10" width="1140" height="760" fill="none" stroke="#000" stroke-width="2"/>
  <text x="30" y="34" font-size="16" font-weight="bold">P&amp;ID - Packed column K-2750</text>

  <!-- ===== Column K-2750 ===== -->
  <rect x="250" y="110" width="100" height="500" rx="30" fill="#fff" stroke="#000" stroke-width="2.5"/>
  <rect x="252" y="170" width="96" height="380" fill="url(#pack)" stroke="#000" stroke-width="1"/>
  <text x="300" y="365" text-anchor="middle" font-weight="bold" fill="#000" stroke="#fff" stroke-width="4" paint-order="stroke">KX-2750</text>
  <text x="400" y="640" font-size="14" font-weight="bold">K-2750</text>
  <text x="400" y="656" font-size="11">Packed column</text>
  <text x="400" y="670" font-size="11">KX-2750 packed section</text>
  <!-- height dimension -->
  <line x1="215" y1="170" x2="215" y2="550" stroke="#000" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <line x1="205" y1="170" x2="250" y2="170" stroke="#000" stroke-width=".5"/>
  <line x1="205" y1="550" x2="250" y2="550" stroke="#000" stroke-width=".5"/>
  <text x="205" y="360" text-anchor="middle" transform="rotate(-90 205 360)">Packed height 14 m</text>
  <!-- diameter dimension -->
  <line x1="252" y1="583" x2="348" y2="583" stroke="#000" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="300" y="576" text-anchor="middle" font-size="11">ID 500 mm</text>

  <!-- ===== N3 top outlet, tee ===== -->
  <rect x="292" y="98" width="16" height="12" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="314" y="100" font-weight="bold">N3</text>
  <line x1="300" y1="98" x2="300" y2="60" stroke="#000" stroke-width="2"/>
  <line x1="130" y1="60" x2="470" y2="60" stroke="#000" stroke-width="2"/>
  <circle cx="300" cy="60" r="3.5" fill="#000"/>
  <text x="308" y="52" font-size="10">TE-275001 (tee)</text>
  <!-- off sheet left -->
  <polygon points="130,48 80,48 62,60 80,72 130,72" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="102" y="64" text-anchor="middle" font-size="10">OSC-N3</text>
  <line x1="300" y1="60" x2="132" y2="60" stroke="#000" stroke-width="2" marker-end="url(#arr)"/>
  <text x="62" y="90" font-size="10">off sheet</text>
  <!-- isolating valve right -->
  <polygon points="390,48 390,72 420,48 420,72" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="405" y="40" text-anchor="middle" font-size="10" font-weight="bold">HV-275001</text>
  <text x="405" y="88" text-anchor="middle" font-size="10">isolating valve</text>

  <!-- ===== N2 bottoms, reducer, line 2750.001.6 ===== -->
  <rect x="292" y="610" width="16" height="12" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="270" y="630" font-weight="bold" text-anchor="end">N2</text>
  <path d="M300 622 V700 H1000" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arr)"/>
  <polygon points="290,640 310,640 304,664 296,664" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="318" y="656" font-size="10" font-weight="bold">RD-275001</text>
  <text x="318" y="668" font-size="10">reducer</text>
  <!-- insulation -->
  <path d="M286 676 V714 H940 V686 H314 V676 Z" fill="none" stroke="#a50" stroke-width="1.2" stroke-dasharray="6 3"/>
  <text x="620" y="732" text-anchor="middle" font-size="10" fill="#a50">insulated (INS)</text>
  <text x="620" y="680" text-anchor="middle" font-weight="bold">2750.001.6</text>
  <polygon points="1000,688 1090,688 1108,700 1090,712 1000,712" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="1050" y="704" text-anchor="middle" font-weight="bold">W 2765</text>
  <text x="1050" y="730" text-anchor="middle" font-size="10">bottoms, off sheet</text>

  <!-- ===== Pressure tappings ===== -->
  <!-- P3 -->
  <rect x="350" y="214" width="12" height="16" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="352" y="206" font-weight="bold">P3</text>
  <line x1="362" y1="222" x2="610" y2="222" stroke="#000" stroke-width="2"/>
  <line x1="390" y1="210" x2="390" y2="234" stroke="#000" stroke-width="5"/>
  <polygon points="425,210 425,234 455,210 455,234" fill="#fff" stroke="#000" stroke-width="2"/>
  <line x1="490" y1="210" x2="490" y2="234" stroke="#000" stroke-width="5"/>
  <text x="390" y="252" text-anchor="middle" font-size="10">BF-275001</text>
  <text x="440" y="200" text-anchor="middle" font-size="10" font-weight="bold">HV-275002</text>
  <text x="440" y="252" text-anchor="middle" font-size="10">root valve</text>
  <text x="490" y="252" text-anchor="middle" font-size="10">BF-275002</text>
  <!-- P4 -->
  <rect x="350" y="492" width="12" height="16" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="352" y="484" font-weight="bold">P4</text>
  <line x1="362" y1="500" x2="610" y2="500" stroke="#000" stroke-width="2"/>
  <line x1="390" y1="488" x2="390" y2="512" stroke="#000" stroke-width="5"/>
  <polygon points="425,488 425,512 455,488 455,512" fill="#fff" stroke="#000" stroke-width="2"/>
  <line x1="490" y1="488" x2="490" y2="512" stroke="#000" stroke-width="5"/>
  <text x="390" y="530" text-anchor="middle" font-size="10">BF-275003</text>
  <text x="440" y="478" text-anchor="middle" font-size="10" font-weight="bold">HV-275003</text>
  <text x="440" y="530" text-anchor="middle" font-size="10">root valve</text>
  <text x="490" y="530" text-anchor="middle" font-size="10">BF-275004</text>

  <!-- ===== DCS ===== -->
  <rect x="580" y="140" width="540" height="440" fill="none" stroke="#06c" stroke-width="1.5" stroke-dasharray="10 5"/>
  <text x="1110" y="160" text-anchor="end" fill="#06c" font-weight="bold">DCS</text>

  <!-- PIZ-275003A -->
  <rect x="610" y="182" width="80" height="80" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <circle cx="650" cy="222" r="36" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="650" y="226" text-anchor="middle" font-size="10" font-weight="bold">PIZ-275003A</text>
  <text x="650" y="275" text-anchor="middle" font-size="10">pressure transmitter</text>
  <!-- PIZ-275003B -->
  <rect x="610" y="460" width="80" height="80" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <circle cx="650" cy="500" r="36" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="650" y="504" text-anchor="middle" font-size="10" font-weight="bold">PIZ-275003B</text>
  <text x="650" y="553" text-anchor="middle" font-size="10">pressure transmitter</text>

  <!-- signals -->
  <path d="M690 222 H780 V345 H850" fill="none" stroke="#06c" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#sarr)"/>
  <path d="M690 500 H780 V375 H850" fill="none" stroke="#06c" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#sarr)"/>

  <!-- PISZA-275003 -->
  <rect x="850" y="310" width="100" height="100" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <circle cx="900" cy="360" r="46" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="900" y="364" text-anchor="middle" font-size="10" font-weight="bold">PISZA-275003</text>
  <text x="900" y="300" text-anchor="middle" font-size="11" font-weight="bold">High-pressure safety function</text>
  <g font-size="11">
    <text x="850" y="436">I - indicates column pressure</text>
    <text x="850" y="452">S - switches on HIGH pressure</text>
    <text x="850" y="468">Z - trips (interlock) on HIGH pressure</text>
    <text x="850" y="484">A - alarms on HIGH pressure</text>
    <text x="850" y="506" font-size="10">Inputs: PIZ-275003A and PIZ-275003B</text>
  </g>

  <!-- legend -->
  <g font-size="10">
    <line x1="30" y1="750" x2="70" y2="750" stroke="#000" stroke-width="2"/><text x="76" y="754">process line</text>
    <line x1="170" y1="750" x2="210" y2="750" stroke="#06c" stroke-width="1.5" stroke-dasharray="6 3"/><text x="216" y="754">signal (to DCS)</text>
    <rect x="320" y="744" width="22" height="12" fill="url(#pack)" stroke="#000"/><text x="348" y="754">packing</text>
    <path d="M410 744h30v12h-30z" fill="none" stroke="#a50" stroke-dasharray="6 3"/><text x="446" y="754">insulation</text>
  </g>
</svg>
