<text class="t l" transform="translate(30 247) scale(1 -1)">DEXPI Example C01, Utilities (area F4, section 10), rev. R2.2 + bypass round PV4712.02</text>
<rect x="30" y="241.6" width="3" height="2" fill="#c00000"/>
<text class="t sm l" transform="translate(35 242.6) scale(1 -1)" dy=".35em">Added: block valves HV4712.03 / HV4712.05 and bypass line with hand globe valve HV4712.04 (NO = normally open, NC = normally closed)</text>
<rect x="221" y="218.8" width="111" height="15.6" fill="none" stroke="#c00000" stroke-width=".3"/>
<text class="t xs l nw" transform="translate(222.5 232) scale(1 -1)">Normal: HV4712.03 and HV4712.05 open, HV4712.04 closed. Recycle goes through PV4712.02.</text>
<text class="t xs l nw" transform="translate(222.5 228.5) scale(1 -1)">To take PV4712.02 out: open HV4712.04 first, then close HV4712.03 and HV4712.05.</text>
<text class="t xs l nw" transform="translate(222.5 225) scale(1 -1)">The recycle 47127 to T4750 stays on line through the bypass; throttle HV4712.04 by hand.</text>
<text class="t xs l nw" transform="translate(222.5 221.5) scale(1 -1)">PV4712.02 is fail closed; with it isolated, loop PICSA4712.02 has no final element.</text>
