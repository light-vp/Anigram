<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="Arial, sans-serif" font-size="13">
  <rect width="800" height="400" fill="#fff"/>
  <text x="20" y="28" font-size="16" font-weight="bold">P&amp;ID: pump P-4713 to plate heat exchanger H-1009</text>

  <!-- Pump P-4713 (centrifugal): circle with discharge nozzle on top -->
  <g id="P-4713" stroke="#000" stroke-width="2" fill="none">
    <circle cx="170" cy="230" r="40"/>
    <polyline points="170,190 205,230 170,270" stroke-width="0"/>
    <path d="M143,203 L210,230 L143,257" stroke-width="0"/>
    <path d="M170,190 L210,190 L210,230" stroke-width="0"/>
    <polyline points="138,212 202,212" stroke-width="0"/>
    <path d="M148,202 L202,230 L148,258"/>
  </g>
  <!-- suction nozzle N-1 (not connected in source) -->
  <line x1="60" y1="230" x2="130" y2="230" stroke="#000" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="60" y="222" font-size="11">N-1 (suction, open)</text>
  <!-- discharge nozzle N-2 -->
  <line x1="170" y1="190" x2="170" y2="150" stroke="#000" stroke-width="3"/>
  <text x="176" y="170" font-size="11">N-2</text>
  <text x="170" y="295" text-anchor="middle" font-weight="bold">P-4713</text>
  <text x="170" y="311" text-anchor="middle" font-size="11">Centrifugal pump</text>

  <!-- Process line P-4713 N-2 to H-1009 N-1 -->
  <polyline points="170,150 170,110 480,110 480,150" fill="none" stroke="#000" stroke-width="3"/>
  <polygon points="320,103 335,110 320,117" fill="#000"/>
  <text x="325" y="98" text-anchor="middle" font-size="11">Line 47132 · DN80 · 75HB13 · MNb</text>

  <!-- Plate heat exchanger H-1009 -->
  <g stroke="#000" stroke-width="2" fill="none">
    <rect x="430" y="150" width="140" height="150"/>
    <g stroke-width="1.5">
      <line x1="450" y1="150" x2="450" y2="300"/>
      <line x1="470" y1="150" x2="470" y2="300"/>
      <line x1="490" y1="150" x2="490" y2="300"/>
      <line x1="510" y1="150" x2="510" y2="300"/>
      <line x1="530" y1="150" x2="530" y2="300"/>
      <line x1="550" y1="150" x2="550" y2="300"/>
    </g>
  </g>
  <text x="480" y="144" text-anchor="middle" font-size="11">N-1</text>
  <!-- other nozzles, unconnected in source -->
  <g stroke="#000" stroke-width="2" stroke-dasharray="6 4">
    <line x1="430" y1="270" x2="380" y2="270"/>
    <line x1="570" y1="180" x2="620" y2="180"/>
    <line x1="570" y1="270" x2="620" y2="270"/>
  </g>
  <text x="335" y="264" font-size="11">N-2 (open)</text>
  <text x="625" y="174" font-size="11">N-3 (open)</text>
  <text x="625" y="264" font-size="11">N-4 (open)</text>
  <text x="500" y="325" text-anchor="middle" font-weight="bold">H-1009</text>
  <text x="500" y="341" text-anchor="middle" font-size="11">Plate heat exchanger</text>
</svg>
