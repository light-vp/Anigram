<?xml version="1.0" encoding="UTF-8"?>
<svg width="920" height="568" class="sheet eng" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 568" style="--paper:#ffffff;--line:#e3e3e1;--tile:#fafaf9;--ink:#18181b;--muted:#8a8a87;--lit:#f5b301;--alarm:#e5484d;--light:#f5b301;--electric:#f08c00;--water:#2f7cf6;--heat:#e5484d;--fuel:#12a594;--mechanical:#71717a;--data:#7c5cf0;--oil:#b4651e;--air:#0f9fbf" role="img" aria-label="Flow control loop: FIC-032 indicates flow and alarms; US-031 safety override acts through YCS-033 on the control valve"><style>
.sheet { font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
.ln { fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
.ln.thin, .thin { stroke-width: 1; }
.ln.solid { fill: var(--tile); }
.inkf { fill: var(--ink); }
.puff { fill: none; stroke: var(--muted); stroke-width: 1; }
.win { fill: none; stroke: var(--ink); stroke-width: 0.9; }
.win.on { fill: var(--lit); stroke: var(--lit); }
.bar { fill: var(--paper); stroke: var(--ink); stroke-width: 1.5; }
.glyphText { font-size: 12px; font-weight: 600; fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
.glyphText.small { font-size: 8.5px; }

.bg { fill: var(--paper); }

.part .tile { fill: var(--tile); stroke: var(--line); stroke-width: 1; transition: stroke 0.2s; }
.part.bad .tile { stroke: var(--alarm); }
.part:hover .tile { stroke: var(--muted); }
.part.selected .tile { stroke: var(--ink); stroke-width: 1.5; }
.part .hit { fill: transparent; }
.part.selectable .hit { cursor: pointer; }
.dim { opacity: 0.18; }
.part, .link, .tagGroup, .labelGroup { transition: opacity 0.25s; }

.label, .value, .tag { paint-order: stroke; stroke: var(--paper); stroke-width: 4px; stroke-linejoin: round; }
.label { font-size: 11.5px; font-weight: 550; fill: var(--ink); }
.value { font-size: 10.5px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.value.bad { fill: var(--alarm); }
.chainArrow { fill: none; stroke: var(--muted); stroke-width: 1.25; stroke-dasharray: 3 4; opacity: 0.55; }
.chainArrow.live { stroke: var(--lit); opacity: 1; stroke-dasharray: none; stroke-width: 1.75; }
.chainRing { fill: none; stroke: var(--lit); stroke-width: 2; }

.route { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.route.loss { stroke-dasharray: 1 5; stroke-width: 1.5; stroke: var(--muted); opacity: 0.6; }
.route.limit { stroke: var(--alarm); }
.stream { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.chev { fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.tag { font-size: 10px; fill: var(--muted); text-anchor: middle; dominant-baseline: central; font-variant-numeric: tabular-nums; }

.title { font-size: 20px; font-weight: 600; letter-spacing: -0.015em; fill: var(--ink); }
.sub { font-size: 12.5px; fill: var(--muted); }
.clock { font-size: 20px; font-weight: 500; fill: var(--ink); text-anchor: end; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.meta { font-size: 11px; fill: var(--muted); text-anchor: end; letter-spacing: 0.02em; }
.legend { font-size: 11px; fill: var(--muted); dominant-baseline: central; }
.credit { font-size: 10px; fill: var(--muted); text-anchor: end; letter-spacing: 0.02em; }
.rule { stroke: var(--line); stroke-width: 1; }
</style><style>
.ln.sym, .sym { fill: var(--paper); }
.mask { fill: var(--paper); stroke: none; }
.ln.inkf { fill: var(--ink); }
.ln.heavy { stroke-width: 3; }
.ln.alarm, .alarmStroke { stroke: var(--alarm); }
.ln.live { stroke: var(--muted); stroke-dasharray: 2 3; }
.lvl { fill: var(--water); opacity: 0.35; stroke: none; }
.lvl.oil { fill: var(--oil); }
.lvl.air { fill: var(--air); }
.lvl.low { fill: var(--alarm); }
.symText { font-size: 13px; font-weight: 600; fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
.symText.small { font-size: 8.5px; font-weight: 500; }
.eng .route { stroke: var(--ink); }
.eng .route.process { stroke-width: 2; }
.eng .route.utility { stroke-width: 1.25; }
.eng .route.signal { stroke-width: 1; stroke-dasharray: 6 4; }
.eng .route.data { stroke-width: 1.6; stroke-dasharray: 0.1 5; }
.eng .route.pneumatic, .eng .route.hydraulic, .eng .route.capillary, .eng .route.electromagnetic { stroke-width: 1; }
.eng .route.idle { stroke: var(--muted); }
.eng .shaft { fill: none; stroke: var(--ink); stroke-width: 4; }
.eng .shaftCore { fill: none; stroke: var(--paper); stroke-width: 2; }
.eng .arrow { fill: var(--ink); }
.eng .arrow.idle { fill: var(--paper); stroke: var(--muted); stroke-width: 1; }
.eng .conn { fill: none; stroke: var(--ink); stroke-width: 1; }
.ln.dashed { stroke-dasharray: 3 2.5; }
.bubbleText { font-size: 9.5px; font-weight: 600; fill: var(--ink); text-anchor: middle; dominant-baseline: central; letter-spacing: 0.02em; }
.eng .tagLabel { font-size: 11.5px; font-weight: 650; fill: var(--ink); letter-spacing: 0.02em; }
.eng .lineNo { font-size: 9.5px; fill: var(--ink); font-variant-numeric: tabular-nums; paint-order: stroke; stroke: var(--paper); stroke-width: 3px; }

.tbCell { fill: var(--paper); stroke: var(--ink); stroke-width: 0.6; }
.tbFrame { fill: none; stroke: var(--ink); stroke-width: 1.4; }
.tbLabel { font-size: 6.5px; fill: var(--muted); letter-spacing: 0.06em; }
.tbValue { font-size: 9.5px; fill: var(--ink); }
.tbValue.muted { font-size: 8.5px; fill: var(--muted); }
.tbTitle { font-size: 12.5px; font-weight: 600; fill: var(--ink); }
.eng .credit { text-anchor: start; }
</style><rect class="bg" width="920" height="568"></rect><g><text class="title" x="40" y="38">Flow control loop</text><text class="sub" x="40" y="58"><tspan x="40" dy="0">FIC-032 indicates flow and alarms; US-031 safety override acts through YCS-033 on the</tspan><tspan x="40" dy="16">control valve</tspan></text><text class="clock" x="880" y="38">06:00</text><text class="meta" x="880" y="58">PID-032 · day 1</text></g><g><g class="link"><title>From upstream → FV-032: 60 m³/h of water</title><path d="M100 384 L460 384" class="route process"></path><path class="arrow" d="M-5 -4 L4 0 L-5 4 Z" transform="translate(280 384) rotate(0)"></path><text class="lineNo" text-anchor="middle" transform="translate(280 384) rotate(0) translate(0 14)">100-W-001</text></g><g class="link"><title>FV-032 → To process: 60 m³/h of water</title><path d="M460 384 L820 384" class="route process"></path><path class="arrow" d="M-5 -4 L4 0 L-5 4 Z" transform="translate(640 384) rotate(0)"></path><text class="lineNo" text-anchor="middle" transform="translate(640 384) rotate(0) translate(0 14)">100-W-002</text></g><g class="link"><path class="conn" d="M340 144 L340 384 Q340 384 340 384 L460 384"></path></g><g class="link"><path class="conn" d="M700 144 L700 384 Q700 384 700 384 L460 384"></path><path class="route signal" d="M700 144 L700 384 Q700 384 700 384 L460 384"></path></g><g class="link"><path class="route signal" d="M460 264 L460 144 Q460 144 460 144 L340 144"></path><path class="route signal" d="M460 264 L460 384"></path></g></g><g><g class="part selectable" transform="translate(100 384)"><g transform="rotate(0)"><path class="ln sym" d="M-18 -9 H8 L18 0 L8 9 H-18 Z"></path></g><rect class="hit" x="-26" y="-26" width="52" height="52"></rect></g><g class="part selectable" transform="translate(460 384)"><g><g><g><path class="ln" d="M0 0 V-16.2"></path><path class="ln sym" d="M-9 -16.2 A 9 9 0 0 1 9 -16.2 Z"></path></g><g><path class="ln sym" d="M-11 -7 L11 7 V-7 L-11 7 Z"></path></g></g></g><