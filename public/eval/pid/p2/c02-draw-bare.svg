<text x="912" y="912" font-size="14" text-anchor="start" font-weight="bold">Notes</text>
<g font-size="11" text-anchor="start">
<text x="912" y="932">Instrument functions as in the file: PIS⁺Z⁺A 275003 receives the signals of</text>
<text x="912" y="949">PI(Z) 275003A (tap P3) and PI(Z) 275003B (tap P4).</text>
<text x="912" y="966">Valve tag H658B1UV is used twice in the source (P3 and P4 lines);</text>
<text x="912" y="983">the two are told apart here as H658B1UV (P3) / H658B1UV (P4).</text>
<text x="912" y="1000">Nozzles N2, N4, N5, N7 and H1 have no piping in the source.</text>
<text x="912" y="1017">Bottom DN150 line and the DN80 line after H672B1V end open in the source.</text>
<text x="912" y="1034">SP 2750-5 / 2750-6 and footnote marks 1) 16) are copied as drawn; footnote</text>
<text x="912" y="1051">texts are not in the file. No set points or trip logic are given in the file.</text>
</g>
<text x="912" y="1082" font-size="10" text-anchor="start" fill="#555">Source: DEXPI test case C02 (column.xml) - BASF SE, Ludwigshafen, V888 / V04 / section 2000</text>
