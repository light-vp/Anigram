<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 640" width="1240" height="640" font-family="Arial, sans-serif" font-size="12">
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs>
<rect width="1240" height="640" fill="#fff"/>
<text x="620" y="30" text-anchor="middle" font-size="18" font-weight="bold">P&amp;ID - Corrosion Inhibitor Injection to Export Pipeline</text>

<!-- process lines -->
<path d="M140,340 L405,340" fill="none" stroke="#000" stroke-width="2"/>
<path d="M475,340 L1100,340" fill="none" stroke="#000" stroke-width="2"/>
<path d="M340,340 L340,520" fill="none" stroke="#000" stroke-width="2"/>
<path d="M540,340 L540,250" fill="none" stroke="#000" stroke-width="2"/>
<path d="M540,200 L540,140 L90,140 L90,240" fill="none" stroke="#000" stroke-width="2" marker-end="url(#ar)"/>
<path d="M640,340 L640,280" fill="none" stroke="#000" stroke-width="1.2"/>
<path d="M1100,90 L1100,600" fill="none" stroke="#000" stroke-width="6"/>
<!-- flow arrows -->
<path d="M170,340 l1,0" stroke="#000" stroke-width="2" marker-end="url(#ar)"/>
<path d="M385,340 l1,0" stroke="#000" stroke-width="2" marker-end="url(#ar)"/>
<path d="M590,340 l1,0" stroke="#000" stroke-width="2" marker-end="url(#ar)"/>
<path d="M1030,340 l1,0" stroke="#000" stroke-width="2" marker-end="url(#ar)"/>

<!-- T-1401 -->
<rect x="40" y="240" width="100" height="140" fill="#fff" stroke="#000" stroke-width="2"/>
<line x1="40" y1="262" x2="140" y2="262" stroke="#000"/>
<text x="90" y="305" text-anchor="middle" font-weight="bold">T-1401</text>
<text x="90" y="322" text-anchor="middle" font-size="11">Inhibitor tote</text>
<text x="90" y="398" text-anchor="middle" font-size="11">Corrosion inhibitor</text>

<!-- V-1401 -->
<polygon points="188,332 212,348 212,332 188,348" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="200" y="322" text-anchor="middle" font-weight="bold">V-1401</text>
<text x="200" y="368" text-anchor="middle" font-size="10">Suction isolation</text>

<!-- S-1401 -->
<rect x="255" y="322" width="50" height="36" fill="#fff" stroke="#000" stroke-width="2"/>
<line x1="262" y1="352" x2="298" y2="328" stroke="#000" stroke-width="1.5"/>
<text x="280" y="314" text-anchor="middle" font-weight="bold">S-1401</text>
<text x="280" y="374" text-anchor="middle" font-size="10">Suction strainer</text>

<!-- V-1402 and CP-1401 -->
<polygon points="332,388 348,412 332,412 348,388" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="358" y="396" font-weight="bold">V-1402</text>
<text x="358" y="410" font-size="10">Pot isolation</text>
<rect x="320" y="440" width="40" height="80" fill="#fff" stroke="#000" stroke-width="2"/>
<line x1="320" y1="455" x2="332" y2="455" stroke="#000"/>
<line x1="320" y1="470" x2="332" y2="470" stroke="#000"/>
<line x1="320" y1="485" x2="332" y2="485" stroke="#000"/>
<line x1="320" y1="500" x2="332" y2="500" stroke="#000"/>
<text x="340" y="540" text-anchor="middle" font-weight="bold">CP-1401</text>
<text x="340" y="555" text-anchor="middle" font-size="10">Calibration pot</text>

<!-- P-1401 -->
<circle cx="440" cy="340" r="35" fill="#fff" stroke="#000" stroke-width="2"/>
<rect x="425" y="325" width="30" height="30" fill="none" stroke="#000" stroke-width="1.5"/>
<line x1="425" y1="340" x2="455" y2="340" stroke="#000" stroke-width="1.5"/>
<text x="440" y="395" text-anchor="middle" font-weight="bold">P-1401</text>
<text x="440" y="409" text-anchor="middle" font-size="10">Injection pump (positive displacement)</text>

<!-- PSV-1401 -->
<polygon points="530,250 550,250 540,225" fill="#fff" stroke="#000" stroke-width="2"/>
<polygon points="530,200 550,200 540,225" fill="#fff" stroke="#000" stroke-width="2"/>
<path d="M562,210 l-8,4 l16,6 l-16,6 l8,4" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="580" y="195" font-weight="bold">PSV-1401</text>
<text x="580" y="209" font-size="10">Pressure relief valve</text>
<text x="300" y="132" text-anchor="middle" font-size="11">Relief return to tote T-1401</text>

<!-- PI-1401 -->
<circle cx="640" cy="262" r="18" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="640" y="266" text-anchor="middle" font-weight="bold">PI</text>
<text x="666" y="250" font-weight="bold">PI-1401</text>
<text x="666" y="264" font-size="10">Discharge pressure gauge</text>

<!-- FI-1401 -->
<circle cx="730" cy="340" r="18" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="730" y="344" text-anchor="middle" font-weight="bold">FI</text>
<text x="730" y="312" text-anchor="middle" font-weight="bold">FI-1401</text>
<text x="730" y="376" text-anchor="middle" font-size="10">Flow indicator</text>

<!-- CV-1401 -->
<circle cx="820" cy="340" r="14" fill="#fff" stroke="#000" stroke-width="2"/>
<polygon points="813,332 813,348 828,340" fill="#000"/>
<line x1="828" y1="331" x2="828" y2="349" stroke="#000" stroke-width="2.5"/>
<text x="820" y="314" text-anchor="middle" font-weight="bold">CV-1401</text>
<text x="820" y="376" text-anchor="middle" font-size="10">Check valve 1</text>

<!-- CV-1402 -->
<circle cx="900" cy="340" r="14" fill="#fff" stroke="#000" stroke-width="2"/>
<polygon points="893,332 893,348 908,340" fill="#000"/>
<line x1="908" y1="331" x2="908" y2="349" stroke="#000" stroke-width="2.5"/>
<text x="900" y="314" text-anchor="middle" font-weight="bold">CV-1402</text>
<text x="900" y="376" text-anchor="middle" font-size="10">Check valve 2</text>

<!-- V-1403 -->
<polygon points="958,332 982,348 982,332 958,348" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="970" y="322" text-anchor="middle" font-weight="bold">V-1403</text>
<text x="970" y="368" text-anchor="middle" font-size="10">Quill isolation</text>

<!-- QL-1401 -->
<path d="M1040,334 L1100,334 L1100,346 L1040,346 z" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="1065" y="326" text-anchor="middle" font-weight="bold">QL-1401</text>
<text x="1065" y="364" text-anchor="middle" font-size="10">Injection quill</text>

<!-- PL-1401 -->
<text x="1120" y="110" font-weight="bold">PL-1401</text>
<text x="1120" y="124" font-size="11">Export pipeline</text>

<!-- notes -->
<text x="40" y="600" font-weight="bold">Notes:</text>
<text x="40" y="616" font-size="11">1. PSV-1401 protects the positive displacement pump discharge against overpressure and relieves back to tote T-1401.</text>
<text x="40" y="632" font-size="11">2. CV-1401 and CV-1402 in series prevent pipeline backflow; V-1403 isolates the quill. CP-1401 is used to calibrate injection rate.</text>
</svg>
