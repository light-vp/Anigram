<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" font-family="Arial,Helvetica,sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z"/></marker></defs>
<rect width="1000" height="650" fill="#fff"/>
<rect x="10" y="10" width="980" height="630" fill="none" stroke="#000"/>
<text x="500" y="32" font-size="16" text-anchor="middle" font-weight="bold">P&amp;ID – Jacketed Stirred Reactor R-1001</text>

<!-- jacket and vessel -->
<path d="M365,260 H535 V405 Q535,460 450,485 Q365,460 365,405 Z" fill="#dff1fb" stroke="#000" stroke-width="1.5"/>
<path d="M380,170 H520 V400 Q520,450 450,470 Q380,450 380,400 Z" fill="#fff" stroke="#000" stroke-width="2.5"/>
