<text x="835" y="577" font-size="10" text-anchor="middle">Product (off sheet)</text>

<!-- legend -->
<line x1="40" y1="610" x2="80" y2="610" stroke="#000" stroke-width="2.2"/><text x="88" y="614" font-size="10">Process</text>
<line x1="150" y1="610" x2="190" y2="610" stroke="#06c" stroke-dasharray="6,3"/><text x="198" y="614" font-size="10">Signal</text>
