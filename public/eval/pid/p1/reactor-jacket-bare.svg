<text x="640" y="185" font-size="10" text-anchor="middle">LT-1001</text>

<!-- product -->
<polyline points="450,470 450,520" fill="none" stroke="#000" stroke-width="2.2"/>
<circle cx="450" cy="545" r="25" fill="#fff" stroke="#000" stroke-width="2"/>
