<!-- jacket return -->
<polyline points="535,280 780,280" fill="none" stroke="#000" stroke-width="2.2" marker-end="url(#ar)"/>
<polygon points="780,264 870,264 890,280 870,296 780,296" fill="#fff" stroke="#000"/>
