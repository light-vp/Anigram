<text x="835" y="312" font-size="10" text-anchor="middle">CW return (off sheet)</text>
<text x="650" y="272" font-size="10" text-anchor="middle">Jacket return</text>

<!-- level -->
<line x1="618" y1="215" x2="520" y2="215" stroke="#06c" stroke-dasharray="6,3"/>
<circle cx="640" cy="215" r="22" fill="#fff" stroke="#000" stroke-width="1.3"/>
