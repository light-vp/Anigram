<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="Calibri,Arial,sans-serif">
<rect width="1200" height="640" fill="#fff"/>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#000"/></marker></defs>
<text x="20" y="24" font-size="16" font-weight="bold">DEXPI Example C03 - P&amp;ID</text>

<!-- process pipe -->
<polyline points="175,236 175,340 750,340 750,95" stroke="#000" stroke-width="3" fill="none"/>

<!-- dead-end stub: plug, blind flange, flange -->
<rect x="168" y="224" width="14" height="12" fill="#000" stroke="#000"/>
<text x="160" y="232" font-size="11" text-anchor="end">PipeFitting-1</text>
<text x="188" y="244" font-size="10" fill="#555">plug</text>
<line x1="155" y1="262" x2="195" y2="262" stroke="#000" stroke-width="2"/>
<text x="150" y="266" font-size="11" text-anchor="end">BlindFlange-1</text>
<text x="200" y="266" font-size="10" fill="#555">blind</text>
<line x1="155" y1="290" x2="195" y2="290" stroke="#000" stroke-width="2"/>
<text x="150" y="294" font-size="11" text-anchor="end">Flange-1</text>

<!-- flanges either side of the valve -->
<line x1="336" y1="321" x2="336" y2="359" stroke="#000" stroke-width="2"/>
<text transform="translate(340,368) rotate(90)" font-size="11">Flange-2</text>
<line x1="390" y1="321" x2="390" y2="359" stroke="#000" stroke-width="2"/>
<text transform="translate(394,368) rotate(90)" font-size="11">Flange-3</text>

<!-- operated valve + electric actuator -->
<circle cx="363" cy="340" r="22" fill="#000" stroke="#000"/>
<line x1="341" y1="318" x2="341" y2="362" stroke="#000" stroke-width="2"/>
<line x1="385" y1="318" x2="385" y2="362" stroke="#000" stroke-width="2"/>
<text transform="translate(367,368) rotate(90)" font-size="11">OperatedValve-1</text>
<line x1="363" y1="340" x2="363" y2="286" stroke="#000" stroke-width="2"/>
<line x1="341" y1="286" x2="385" y2="286" stroke="#000" stroke-width="2"/>
<rect x="341" y="264" width="44" height="22" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="393" y="280" font-size="11">ControlledActuator-1</text>
<text x="393" y="294" font-size="10" fill="#555">electric, fail action FB</text>

<!-- restriction orifice -->
<line x1="526" y1="314" x2="526" y2="366" stroke="#000" stroke-width="2"/>
<line x1="554" y1="314" x2="554" y2="366" stroke="#000" stroke-width="2"/>
<line x1="540" y1="314" x2="540" y2="335" stroke="#000" stroke-width="2"/>
<line x1="540" y1="345" x2="540" y2="366" stroke="#000" stroke-width="2"/>
<text transform="translate(544,372) rotate(90)" font-size="11">RestrictionOrifice-1</text>

<!-- ball valve -->
<circle cx="582" cy="340" r="22" fill="#fff" stroke="#000" stroke-width="2"/>
<line x1="560" y1="318" x2="560" y2="362" stroke="#000" stroke-width="2"/>
<line x1="604" y1="318" x2="604" y2="362" stroke="#000" stroke-width="2"/>
<text transform="translate(586,368) rotate(90)" font-size="11">BallValve-1</text>

<!-- reducer: 0800 end left, 0200 end right (as in file) -->
<polygon points="610,318 640,332 640,348 610,362" fill="#fff" stroke="#000" stroke-width="2"/>
<text transform="translate(629,368) rotate(90)" font-size="11">PipeReducer-1</text>
<text x="685" y="297" font-size="12" text-anchor="middle">0200x0800</text>

<!-- slope symbol and flow arrow on riser -->
<polygon points="760,208 760,282 745,282" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="768" y="250" font-size="10" fill="#555">slope</text>
<polygon points="750,98 742,133 758,133" fill="#000"/>

<!-- off-page connector -->
<rect x="650" y="45" width="200" height="50" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="750" y="66" font-size="12" text-anchor="middle">FlowOutPipeOffPageConnector-1</text>
<text x="750" y="84" font-size="11" text-anchor="middle" fill="#555">flow out</text>

<!-- line number labels -->
<line x1="290" y1="343" x2="290" y2="494" stroke="#000" stroke-width="1" marker-start="url(#ar)"/>
<text x="290" y="514" font-size="12" text-anchor="middle">D-13L37014A-0200PB-FD120-0F000N</text>
<text x="290" y="530" font-size="10" text-anchor="middle" fill="#555">PipingNetworkSystem-1</text>
<line x1="507" y1="343" x2="507" y2="494" stroke="#000" stroke-width="1" marker-start="url(#ar)"/>
<line x1="507" y1="494" x2="540" y2="494" stroke="#000" stroke-width="1"/>
<text x="650" y="514" font-size="12" text-anchor="middle">D-13L37007A-0200PB-FS720-0F000N</text>
<text x="650" y="530" font-size="10" text-anchor="middle" fill="#555">PipingNetworkSystem-2</text>
<line x1="753" y1="160" x2="784" y2="160" stroke="#000" stroke-width="1" marker-end="url(#ar)"/>
<text x="795" y="164" font-size="12">D-43L37007A-0800VF-AS7F0-0F000N</text>
<text x="795" y="180" font-size="10" fill="#555">PipingNetworkSystem-3</text>

<!-- instrument function ESV 3712, central location, panel D-13 -->
<rect x="63" y="123" width="74" height="74" fill="#fff" stroke="#000"/>
<circle cx="100" cy="160" r="37" fill="#fff" stroke="#000"/>
<line x1="63" y1="160" x2="137" y2="160" stroke="#000"/>
<text x="100" y="154" font-size="14" text-anchor="middle">ESV</text>
<text x="100" y="176" font-size="14" text-anchor="middle">3712</text>
<text x="63" y="118" font-size="12" text-anchor="end">D-13</text>
<text x="100" y="212" font-size="11" text-anchor="middle">ESV-3712</text>

<!-- signal to actuator (dashed) -->
<polyline points="137,160 363,160 363,264" stroke="#000" stroke-width="1.2" stroke-dasharray="6,3" fill="none" marker-end="url(#ar)"/>

<!-- ESD input symbol -->
<polygon points="363,125 323,55 323,27 403,27 403,55" fill="#fff" stroke="#000"/>
<line x1="323" y1="55" x2="403" y2="55" stroke="#000"/>
<line x1="363" y1="125" x2="363" y2="160" stroke="#000" stroke-width="1.2" stroke-dasharray="6,3"/>
<polygon points="363,160 368,145 358,145" fill="#000"/>
<text x="318" y="40" font-size="12" text-anchor="end">D</text>
<text x="363" y="78" font-size="13" text-anchor="middle">ESD</text>

<!-- actuating-system label ESV 3712 with leader to actuator -->
<circle cx="283" cy="215" r="37" fill="#fff" stroke="#000"/>
<text x="283" y="211" font-size="14" text-anchor="middle">ESV</text>
<text x="283" y="231" font-size="14" text-anchor="middle">3712</text>
<text x="246" y="172" font-size="12" text-anchor="end">D-13</text>
<line x1="307" y1="243" x2="343" y2="309" stroke="#000" stroke-width="1"/>

<!-- notes -->
<text x="20" y="575" font-size="11" fill="#333">Heavy line = process pipe, dashed = signal. Tags are the file's own IDs and instrument number; the file gives no other tag names.</text>
<text x="20" y="591" font-size="11" fill="#333">OperatedValve-1: electric actuator, fail action FB (as written in the file). Signal ESV 3712 (function SV, central location, panel D-13) and the ESD input act on the actuator.</text>
<text x="20" y="607" font-size="11" fill="#333">File inconsistencies kept as-is: segment S1 of 13L37014A is class FD220 vs line class FD120; reducer 0200x0800 has flow-in recorded on its 0800 end.</text>
</svg>
