<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">
<defs>
<marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0,0 10,4 0,8"/></marker>
<g id="base" fill="none" stroke="#000" stroke-width="2">
<rect x="10" y="10" width="1380" height="420" stroke="#888" stroke-width="1"/>
<!-- main process line -->
<polyline points="40,270 205,270"/>
<polyline points="240,170 240,110 485,110"/>
<polyline points="555,110 670,110"/>
<polyline points="770,110 990,110"/>
<polyline points="1014,110 1288,110" marker-end="url(#ar)"/>
<!-- off-sheet connectors -->
<polygon points="20,258 40,270 20,282" fill="#fff"/>
<polygon points="1288,98 1313,110 1288,122" fill="#fff"/>
<!-- V-401 -->
<rect x="205" y="170" width="70" height="170" rx="30" fill="#fff"/>
<line x1="212" y1="215" x2="268" y2="215" stroke-width="1" stroke-dasharray="3 2"/>
<!-- K-401 -->
<circle cx="520" cy="110" r="35" fill="#fff"/>
<polyline points="497,90 543,100 543,120 497,130"/>
<!-- E-401 -->
<rect x="670" y="88" width="100" height="44" rx="8" fill="#fff"/>
<polyline points="676,110 690,96 704,124 718,96 732,124 746,96 764,110" stroke-width="1"/>
<!-- instrument taps -->
<polyline points="380,110 380,170" stroke-width="1"/>
<polyline points="790,110 790,170" stroke-width="1"/>
<!-- FT-401 / PT-402 bubbles -->
<g fill="#fff" stroke-width="1.5">
<circle cx="380" cy="194" r="24"/><line x1="356" y1="194" x2="404" y2="194"/>
<circle cx="790" cy="194" r="24"/><line x1="766" y1="194" x2="814" y2="194"/>
</g>
<!-- signals -->
<g stroke-width="1.2" stroke-dasharray="6 3">
<polyline points="380,218 380,240 574,240" marker-end="url(#ar)"/>
<polyline points="790,218 790,240 626,240" marker-end="url(#ar)"/>
<polyline points="600,264 600,300 480,300 480,320" marker-end="url(#ar)"/>
</g>
<!-- UIC-401 -->
<rect x="576" y="216" width="48" height="48" fill="#fff" stroke-width="1.5"/>
<!-- PSV-401 -->
<polyline points="900,110 900,88"/>
<polygon points="885,88 915,88 900,68" fill="#fff" stroke-width="1.5"/>
<polygon points="885,48 915,48 900,68" fill="#fff" stroke-width="1.5"/>
<polyline points="915,68 930,68" stroke-width="1"/>
<polyline points="900,48 900,28 960,28" marker-end="url(#ar)"/>
<!-- NRV-401 -->
<polygon points="990,98 990,122 1010,110" fill="#000"/>
<line x1="1012" y1="96" x2="1012" y2="124" stroke-width="3"/>
<!-- FV-401 stem and actuator -->
<line x1="480" y1="370" x2="480" y2="338" stroke-width="1.5"/>
<path d="M462,338 A18,14 0 0 1 498,338 Z" fill="#fff" stroke-width="1.5"/>
<!-- junctions -->
<circle cx="830" cy="110" r="4" fill="#000"/>
<circle cx="120" cy="270" r="4" fill="#000"/>
<!-- labels -->
<g fill="#000" stroke="none">
<text x="30" y="300" font-size="11">OSC-1</text><text x="30" y="314" font-size="10">Gas in</text>
<text x="1301" y="140" font-size="11">OSC-2</text><text x="1301" y="154" font-size="10">To export header</text>
<text x="240" y="360" font-size="13" font-weight="bold">V-401</text><text x="240" y="375" font-size="10">Suction scrubber</text>
<text x="520" y="62" font-size="13" font-weight="bold">K-401</text><text x="520" y="168" font-size="10">Centrifugal compressor</text>
<text x="720" y="76" font-size="13" font-weight="bold">E-401</text><text x="720" y="148" font-size="10">Discharge after-cooler</text>
<text x="380" y="190" font-weight="bold">FT</text><text x="380" y="206" font-weight="bold">401</text><text x="380" y="232" font-size="11">FT-401</text>
<text x="790" y="190" font-weight="bold">PT</text><text x="790" y="206" font-weight="bold">402</text><text x="790" y="232" font-size="11">PT-402</text>
<text x="600" y="236" font-weight="bold">UIC</text><text x="600" y="252" font-weight="bold">401</text><text x="600" y="282" font-size="10">UIC-401 anti-surge controller</text>
<text x="940" y="64" font-size="12" font-weight="bold" text-anchor="start">PSV-401</text><text x="940" y="78" font-size="10" text-anchor="start">Discharge relief valve</text>
<text x="975" y="32" font-size="10" text-anchor="start">OSC-3 to flare</text>
<text x="1002" y="82" font-size="12" font-weight="bold">NRV-401</text><text x="1002" y="150" font-size="10">Check valve</text>
<text x="460" y="326" font-size="10" text-anchor="end">FV-401 actuator</text>
</g>
</g>
</defs>
<rect width="1400" height="900" fill="#fff"/>

<!-- ===== CASE A: DAY ===== -->
<g>
<use href="#base"/>
<text x="30" y="35" font-size="14" font-weight="bold" text-anchor="start" fill="#333">CASE A – DAY: export demand HIGH → far from surge → UIC-401 holds FV-401 SHUT, no flow in recycle line</text>
<polyline points="830,110 830,370 120,370 120,270" fill="none" stroke="#aaa" stroke-width="2"/>
<polygon points="460,358 460,382 480,370" fill="#000" stroke="#000"/>
<polygon points="500,358 500,382 480,370" fill="#000" stroke="#000"/>
<text x="480" y="408" font-weight="bold">FV-401 Anti-surge valve – CLOSED (0%)</text>
<text x="300" y="392" font-size="11" fill="#666">Anti-surge recycle line – static, no flow</text>
<text x="1000" y="230" font-size="11" text-anchor="start">Export flow HIGH – all discharge gas passes NRV-401 to header</text>
<text x="1000" y="248" font-size="11" text-anchor="start" fill="#666">Recycle line grey: FV-401 shut, nothing circulating</text>
<text x="1000" y="266" font-size="11" text-anchor="start">FT-401 above surge limit → UIC-401 output 0% → FV-401 shut</text>
</g>

<!-- ===== CASE B: NIGHT ===== -->
<g transform="translate(0,450)">
<use href="#base"/>
<text x="30" y="35" font-size="14" font-weight="bold" text-anchor="start" fill="#0a4d8c">CASE B – NIGHT: export demand LOW → near surge → UIC-401 OPENS FV-401, gas goes round the recycle</text>
<polyline points="830,110 830,370 120,370 120,270" fill="none" stroke="#0a7bd1" stroke-width="3" stroke-dasharray="14 8">
<animate attributeName="stroke-dashoffset" from="44" to="0" dur="1.5s" repeatCount="indefinite"/>
</polyline>
<g fill="#0a7bd1">
<polygon points="824,250 836,250 830,264"/>
<polygon points="700,362 680,370 700,378"/>
<polygon points="330,362 310,370 330,378"/>
<polygon points="112,330 128,330 120,314"/>
</g>
<polygon points="460,358 460,382 480,370" fill="#9fe0ae" stroke="#000" stroke-width="1.5"/>
<polygon points="500,358 500,382 480,370" fill="#9fe0ae" stroke="#000" stroke-width="1.5"/>
<text x="480" y="408" font-weight="bold" fill="#1a9a3a">FV-401 Anti-surge valve – OPEN</text>
<text x="300" y="392" font-size="11" fill="#0a7bd1">Anti-surge recycle line – gas flowing back to suction (upstream of V-401)</text>
<text x="1000" y="230" font-size="11" text-anchor="start">Export flow LOW – NRV-401 passes only the net export gas</text>
<text x="1000" y="248" font-size="11" text-anchor="start" fill="#0a7bd1">Loop: V-401 → K-401 → E-401 → FV-401 → V-401</text>
<text x="1000" y="266" font-size="11" text-anchor="start">FT-401 falls to surge limit → UIC-401 output rises → FV-401 opens</text>
</g>
<text x="700" y="892" font-size="10" fill="#555">Solid = process pipe; dashed with arrow = instrument signal. Tags NRV-401 and OSC-1/2/3 were assigned by the drafter; all other tags as specified.</text>
</svg>
