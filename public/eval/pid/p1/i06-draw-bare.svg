<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Arial, sans-serif" font-size="12">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#000"/></marker>
  </defs>
  <rect width="900" height="520" fill="#fff"/>
  <text x="450" y="28" text-anchor="middle" font-size="16" font-weight="bold">Flow control loop 033 / 032 / 031</text>

  <!-- control room / field boundary -->
  <line x1="20" y1="290" x2="880" y2="290" stroke="#666" stroke-dasharray="10,5"/>
  <text x="30" y="60" fill="#666">CONTROL ROOM (central location)</text>
  <text x="30" y="310" fill="#666">FIELD</text>

  <!-- process line -->
  <line x1="40" y1="400" x2="860" y2="400" stroke="#000" stroke-width="3" marker-end="url(#ar)"/>
  <text x="50" y="390">process line</text>

  <!-- FE-032 orifice plate -->
  <line x1="244" y1="388" x2="244" y2="412" stroke="#000" stroke-width="3"/>
  <line x1="256" y1="388" x2="256" y2="412" stroke="#000" stroke-width="3"/>
  <text x="250" y="436" text-anchor="middle">FE-032</text>
  <text x="250" y="450" text-anchor="middle" font-size="10">flow element</text>

  <!-- FV-033 globe valve + diaphragm actuator -->
  <polygon points="580,385 600,400 580,415" fill="#fff" stroke="#000" stroke-width="2"/>
  <polygon points="620,385 600,400 620,415" fill="#fff" stroke="#000" stroke-width="2"/>
  <circle cx="600" cy="400" r="4" fill="#000"/>
  <line x1="600" y1="396" x2="600" y2="362" stroke="#000" stroke-width="2"/>
  <path d="M580,362 A20,20 0 0 1 620,362 z" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="600" y="436" text-anchor="middle">FV-033</text>
  <text x="600" y="450" text-anchor="middle" font-size="10">globe control valve, with actuator</text>

  <!-- measuring line FE-032 -> FIC-032 -->
  <line x1="250" y1="388" x2="250" y2="228" stroke="#000" stroke-dasharray="6,4" marker-end="url(#ar)"/>
  <line x1="244" y1="340" x2="256" y2="334" stroke="#000"/>
  <text x="262" y="330" font-size="10">measuring signal</text>

  <!-- FIC-032 -->
  <circle cx="250" cy="200" r="28" fill="#fff" stroke="#000" stroke-width="2"/>
  <line x1="222" y1="200" x2="278" y2="200" stroke="#000"/>
  <text x="250" y="194" text-anchor="middle" font-weight="bold">FIC</text>
  <text x="250" y="216" text-anchor="middle" font-weight="bold">032</text>
  <text x="250" y="156" text-anchor="middle" font-size="10">flow indicating controller</text>
  <text x="250" y="168" text-anchor="middle" font-size="10">(indication in control room)</text>

  <!-- alarm signal FIC-032 -> YCS-033 -->
  <line x1="278" y1="200" x2="570" y2="200" stroke="#000" stroke-dasharray="6,4" marker-end="url(#ar)"/>
  <text x="424" y="190" text-anchor="middle">alarm (A), high</text>

  <!-- YCS-033 -->
  <circle cx="600" cy="200" r="28" fill="#fff" stroke="#000" stroke-width="2"/>
  <line x1="572" y1="200" x2="628" y2="200" stroke="#000"/>
  <text x="600" y="194" text-anchor="middle" font-weight="bold">YCS</text>
  <text x="600" y="216" text-anchor="middle" font-weight="bold">033</text>

  <!-- output signals with no destination in the file -->
  <line x1="588" y1="173" x2="570" y2="120" stroke="#000" stroke-dasharray="6,4" marker-end="url(#ar)"/>
  <text x="566" y="112" text-anchor="end" font-size="10">output (O), high status - no target in file</text>
  <line x1="612" y1="173" x2="630" y2="120" stroke="#000" stroke-dasharray="6,4" marker-end="url(#ar)"/>
  <text x="634" y="112" font-size="10">output (O), low status - no target in file</text>

  <!-- YCS-033 -> actuator of FV-033 -->
  <line x1="600" y1="228" x2="600" y2="342" stroke="#000" stroke-dasharray="6,4" marker-end="url(#ar)"/>
  <text x="610" y="270" font-size="10">actuating signal</text>

  <!-- US-031 safety override -->
  <circle cx="790" cy="200" r="28" fill="#fff" stroke="#000" stroke-width="2"/>
  <line x1="762" y1="200" x2="818" y2="200" stroke="#000"/>
  <text x="790" y="194" text-anchor="middle" font-weight="bold">US</text>
  <text x="790" y="216" text-anchor="middle" font-weight="bold">031</text>
  <text x="790" y="156" text-anchor="middle" font-size="10">safety override switch</text>
  <line x1="762" y1="200" x2="630" y2="200" stroke="#000" stroke-dasharray="6,4" marker-end="url(#ar)"/>
  <text x="696" y="190" text-anchor="middle" font-size="10">override</text>

  <!-- legend -->
  <line x1="40" y1="480" x2="90" y2="480" stroke="#000" stroke-width="3"/><text x="98" y="484" font-size="11">process</text>
  <line x1="180" y1="480" x2="230" y2="480" stroke="#000" stroke-dasharray="6,4"/><text x="238" y="484" font-size="11">signal</text>
  <text x="330" y="484" font-size="11">Bubble with line = instrument in control room (central location)</text>
</svg>
