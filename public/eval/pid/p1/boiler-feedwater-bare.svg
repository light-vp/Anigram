<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 700" width="1360" height="700" font-family="Arial, Helvetica, sans-serif" font-size="12">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
    <marker id="sarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
  </defs>
  <rect width="1360" height="700" fill="#fff"/>
  <text x="680" y="680" text-anchor="middle" font-size="16" font-weight="bold">BOILER FEEDWATER SYSTEM - P&amp;ID</text>

  <!-- ===== Process lines ===== -->
  <g fill="none" stroke="#000" stroke-width="2.5" marker-end="none">
    <!-- make-up water -->
    <path d="M40,200 H300" marker-end="url(#arr)"/>
    <!-- D-501 outlet and suction header -->
    <path d="M390,270 V330 H700"/>
    <path d="M480,330 V455"/>
    <path d="M700,330 V455"/>
    <!-- discharge A / B and common discharge -->
    <path d="M480,475 V610 H1100 V450"/>
    <path d="M700,475 V610"/>
    <!-- PSL tap -->
    <path d="M800,610 V548" stroke-width="1.2"/>
    <!-- overflow -->
    <path d="M480,235 H590" marker-end="url(#arr)"/>
    <!-- steam out -->
    <path d="M1150,330 V290 H1310" marker-end="url(#arr)"/>
  </g>
  <circle cx="480" cy="330" r="4"/><circle cx="700" cy="610" r="4"/><circle cx="800" cy="610" r="3"/>

  <!-- ===== Vessels ===== -->
  <rect x="300" y="130" width="180" height="140" rx="30" fill="#eef6fb" stroke="#000" stroke-width="2.5"/>
  <rect x="302" y="190" width="176" height="78" rx="28" fill="#bfe0f2" opacity="0.7"/>
  <line x1="302" y1="190" x2="478" y2="190" stroke="#2874a6" stroke-dasharray="5,3"/>
  <text x="390" y="166" text-anchor="middle" font-weight="bold">D-501</text>
  <text x="390" y="182" text-anchor="middle" font-size="11">Deaerator</text>
  <text x="390" y="238" text-anchor="middle" font-size="10" fill="#1b4f72">normal level</text>

  <rect x="980" y="330" width="240" height="120" rx="55" fill="#eef6fb" stroke="#000" stroke-width="2.5"/>
  <rect x="982" y="385" width="236" height="63" rx="40" fill="#bfe0f2" opacity="0.7"/>
  <line x1="990" y1="385" x2="1210" y2="385" stroke="#2874a6" stroke-dasharray="5,3"/>
  <text x="1100" y="360" text-anchor="middle" font-weight="bold">V-502</text>
  <text x="1100" y="376" text-anchor="middle" font-size="11">Steam drum</text>
  <text x="1160" y="415" text-anchor="middle" font-size="10" fill="#1b4f72">normal level</text>

  <!-- ===== Pumps ===== -->
  <g stroke="#000" stroke-width="2.5" fill="#fff">
    <circle cx="480" cy="450" r="25"/>
    <circle cx="700" cy="450" r="25"/>
  </g>
  <g fill="none" stroke="#000" stroke-width="2">
    <path d="M466,438 L494,450 L466,462 z" transform="rotate(90 480 450)"/>
    <path d="M686,438 L714,450 L686,462 z" transform="rotate(90 700 450)"/>
  </g>
  <text x="450" y="446" text-anchor="end" font-weight="bold">P-501A</text>
  <text x="450" y="461" text-anchor="end" font-size="11">Boiler feed pump (duty)</text>
  <text x="670" y="446" text-anchor="end" font-weight="bold">P-501B</text>
  <text x="670" y="461" text-anchor="end" font-size="11">Boiler feed pump (standby)</text>

  <!-- ===== Manual valves (bowtie, vertical) ===== -->
  <g fill="#fff" stroke="#000" stroke-width="2">
    <path d="M472,368 L488,392 H472 L488,368 z"/>
    <path d="M692,368 L708,392 H692 L708,368 z"/>
    <path d="M472,553 L488,577 H472 L488,553 z"/>
    <path d="M692,553 L708,577 H692 L708,553 z"/>
    <!-- check valves: triangle pointing down in flow direction with seat bar -->
    <path d="M471,507 H489 L480,523 z"/>
    <path d="M691,507 H709 L700,523 z"/>
  </g>
  <g stroke="#000" stroke-width="2.5"><line x1="470" y1="525" x2="490" y2="525"/><line x1="690" y1="525" x2="710" y2="525"/></g>
  <g font-size="11">
    <text x="498" y="384">HV-501A</text><text x="498" y="519">NRV-501A</text><text x="498" y="569">HV-502A</text>
    <text x="718" y="384">HV-501B</text><text x="718" y="519">NRV-501B</text><text x="718" y="569">HV-502B</text>
  </g>
  <text x="498" y="397" font-size="9" fill="#555">suction isolation, open</text>
  <text x="498" y="582" font-size="9" fill="#555">discharge isolation, open</text>
  <text x="718" y="397" font-size="9" fill="#555">suction isolation, open</text>
  <text x="718" y="595" font-size="9" fill="#555">discharge isolation, open</text>

  <!-- ===== Control valves ===== -->
  <g fill="#fff" stroke="#000" stroke-width="2">
    <!-- LV-501 on make-up line -->
    <path d="M158,192 V208 L182,192 V208 z" transform="translate(0,0)"/>
    <line x1="170" y1="200" x2="170" y2="182"/>
    <path d="M155,182 A15,12 0 0 1 185,182 z"/>
    <!-- LV-502 on common discharge -->
    <path d="M888,602 V618 L912,602 V618 z"/>
    <line x1="900" y1="610" x2="900" y2="592"/>
    <path d="M885,592 A15,12 0 0 1 915,592 z"/>
  </g>
  <text x="170" y="228" text-anchor="middle" font-weight="bold">LV-501</text>
  <text x="170" y="241" text-anchor="middle" font-size="10">Make-up control valve</text>
  <text x="170" y="253" text-anchor="middle" font-size="9" fill="#555">fail closed</text>
  <text x="900" y="640" text-anchor="middle" font-weight="bold">LV-502</text>
  <text x="900" y="653" text-anchor="middle" font-size="10">Feedwater control valve</text>

  <!-- ===== Instruments ===== -->
  <g fill="#fff" stroke="#000" stroke-width="1.5">
    <circle cx="360" cy="60" r="24"/>
    <circle cx="240" cy="60" r="26"/>
    <circle cx="450" cy="60" r="26"/>
    <circle cx="920" cy="390" r="24"/>
    <circle cx="830" cy="390" r="26"/>
    <circle cx="800" cy="530" r="18"/>
    <circle cx="1050" cy="240" r="26"/>
  </g>
  <!-- LIC bubbles: DCS (horizontal line) -->
  <g stroke="#000" stroke-width="1"><line x1="214" y1="60" x2="266" y2="60"/><line x1="804" y1="390" x2="856" y2="390"/></g>
  <g text-anchor="middle" font-size="11" font-weight="bold">
    <text x="360" y="64">LT-501</text>
    <text x="240" y="56">LIC-501</text>
    <text x="450" y="56">LSHH-501</text>
    <text x="920" y="394">LT-502</text>
    <text x="830" y="386">LIC-502</text>
    <text x="800" y="534" font-size="10">PSL-501</text>
    <text x="1050" y="236">LSLL-502</text>
  </g>
  <g text-anchor="middle" font-size="9" fill="#555">
    <text x="240" y="72">DCS</text>
    <text x="830" y="402">DCS</text>
    <text x="450" y="70">level switch HH</text>
    <text x="1050" y="250">level switch LL</text>
    <text x="800" y="508">low pressure</text>
  </g>
  <text x="360" y="22" text-anchor="middle" font-size="10" fill="#555"></text>

  <!-- impulse lines (thin solid) -->
  <g stroke="#000" stroke-width="1" fill="none">
    <path d="M360,84 V130"/>
    <path d="M450,86 V130"/>
    <path d="M944,390 H985"/>
    <path d="M1050,266 V332"/>
  </g>

  <!-- ===== Signals (dashed) ===== -->
  <g fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6,4" marker-end="none">
    <path d="M336,60 H266" marker-end="url(#sarr)"/>
    <path d="M240,86 V110 H170 V160" marker-end="url(#sarr)"/>
    <path d="M450,34 V18 H128 V168 H153" marker-end="url(#sarr)"/>
    <path d="M896,390 H856" marker-end="url(#sarr)"/>
    <path d="M830,416 V545 H900 V578" marker-end="url(#sarr)"/>
    <path d="M800,512 V450 H727" marker-end="url(#sarr)"/>
    <path d="M1076,240 H1310" marker-end="url(#sarr)"/>
  </g>
  <g font-size="10" fill="#c0392b">
    <text x="134" y="14">LSHH-501 closes LV-501 (override of LIC-501)</text>
    <text x="808" y="470">start P-501B on low header pressure</text>
    <text x="1180" y="232">trip boiler / fuel (off sheet)</text>
  </g>

  <!-- ===== Off-sheet labels ===== -->
  <text x="40" y="190" font-size="12" font-weight="bold">Make-up water</text>
  <text x="40" y="218" font-size="10">from off sheet</text>
  <text x="496" y="227" font-size="10">Overflow to safe drain (off sheet)</text>
  <text x="1230" y="282" font-size="10">Steam to header</text>
  <text x="1230" y="304" font-size="10">(off sheet)</text>

  <!-- ===== Notes ===== -->
  <rect x="30" y="300" width="330" height="290" fill="#fffbe6" stroke="#999"/>
  <g font-size="11">
    <text x="42" y="320" font-weight="bold">P-501A trip during the day - intended response</text>
    <text x="42" y="342">1. P-501A trips; common discharge pressure falls.</text>
    <text x="42" y="362">2. PSL-501 (low pressure) auto-starts standby P-501B.</text>
    <text x="42" y="382">   HV-501B and HV-502B are normally open so B is</text>
    <text x="42" y="397">   ready; NRV-501A stops back-flow through A.</text>
    <text x="42" y="417">3. LIC-502 / LT-502 keep LV-502 modulating on the</text>
    <text x="42" y="432">   common discharge; drum inventory carries V-502</text>
    <text x="42" y="447">   through the changeover.</text>
    <text x="42" y="467">4. If drum level still falls, LSLL-502 trips the boiler</text>
    <text x="42" y="482">   before V-502 runs dry.</text>
    <text x="42" y="502">5. LIC-501 / LT-501 hold D-501 level via LV-501. If</text>
    <text x="42" y="517">   draw drops, level rises: LSHH-501 closes LV-501</text>
    <text x="42" y="532">   and the overflow line protects against spill.</text>
    <text x="42" y="555" font-size="10" fill="#555">Alarm/trip set points and hold-up times are to be</text>
    <text x="42" y="568" font-size="10" fill="#555">confirmed by calculation; not shown on this sheet.</text>
  </g>

  <!-- ===== Legend ===== -->
  <g font-size="10">
    <line x1="1080" y1="560" x2="1120" y2="560" stroke="#000" stroke-width="2.5"/><text x="1128" y="564">Process line</text>
    <line x1="1080" y1="580" x2="1120" y2="580" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6,4"/><text x="1128" y="584">Signal</text>
    <line x1="1080" y1="600" x2="1120" y2="600" stroke="#000" stroke-width="1"/><text x="1128" y="604">Impulse / sensing connection</text>
  </g>
</svg>
