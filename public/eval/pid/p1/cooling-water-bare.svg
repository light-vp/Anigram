<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" width="1400" height="800" font-family="Arial, sans-serif">
<defs>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
<marker id="as" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1450c8"/></marker>
</defs>
<style>.p{stroke:#000;stroke-width:3;fill:none}.s{stroke:#1450c8;stroke-width:1.5;stroke-dasharray:6 4;fill:none}.v{fill:#fff;stroke:#000;stroke-width:2}
.t{font-size:12px}.tb{font-size:12px;font-weight:bold}.n{font-size:11px;fill:#444}.h{font-size:20px;font-weight:bold}</style>
<rect width="1400" height="800" fill="#fff"/>
<text x="20" y="30" class="h">P&amp;ID - Cooling Water Circuit CT-601 / E-601</text>
<text x="20" y="48" class="n">Percentages on the operating profile are illustrative, not design data.</text>

<!-- cooling tower -->
<rect x="60" y="100" width="200" height="400" fill="#f4f8fb" stroke="#000" stroke-width="2.5"/>
<rect x="61" y="440" width="198" height="59" fill="#bfe0f5"/>
<line x1="61" y1="440" x2="259" y2="440" stroke="#2a7ab8" stroke-dasharray="4 3"/>
<g stroke="#aaa">
<line x1="80" y1="190" x2="240" y2="204"/><line x1="80" y1="204" x2="240" y2="190"/>
<line x1="80" y1="240" x2="240" y2="254"/><line x1="80" y1="254" x2="240" y2="240"/>
<line x1="80" y1="290" x2="240" y2="304"/><line x1="80" y1="304" x2="240" y2="290"/>
<line x1="80" y1="340" x2="240" y2="354"/><line x1="80" y1="354" x2="240" y2="340"/>
</g>
<line x1="100" y1="125" x2="220" y2="125" stroke="#2a7ab8" stroke-width="2" stroke-dasharray="2 6"/>
<text x="160" y="148" class="tb" text-anchor="middle">CT-601 Cooling tower</text>
<text x="160" y="163" class="n" text-anchor="middle">(return water sprayed at top)</text>
<text x="160" y="468" class="tb" text-anchor="middle">Basin</text>

<!-- return line and bypass -->
<polyline class="p" points="1010,285 1100,285 1100,60 160,60 160,100" marker-end="url(#ar)"/>
<text x="640" y="50" class="n" text-anchor="middle">Warm return to top of CT-601</text>
<polyline class="p" points="400,60 400,450 260,450" marker-end="url(#ar)"/>
<circle cx="400" cy="60" r="4" fill="#000"/>
<text x="415" y="110" class="n">Tower bypass (warm return to basin)</text>

<!-- TV-601 -->
<polygon class="v" points="390,252 410,268 410,252 390,268"/>
<line x1="400" y1="252" x2="400" y2="238" stroke="#000" stroke-width="1.5"/>
<path d="M386,238 A14,14 0 0 1 414,238 z" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="425" y="290" class="tb">TV-601</text>
<text x="425" y="304" class="n">06:00 ~60% open</text>
<text x="425" y="317" class="n">15:00 ~20% open</text>

<!-- suction header -->
<polyline class="p" points="260,485 320,485 320,680"/>
<circle cx="320" cy="540" r="4" fill="#000"/>
<text x="290" y="505" class="n" text-anchor="middle">Basin outlet</text>

<!-- pump A (duty, running) -->
<polyline class="p" points="320,540 422,540"/>
<polygon class="v" points="360,532 380,548 380,532 360,548"/>
<text x="370" y="524" class="t" text-anchor="middle">HV-601A</text>
<text x="370" y="562" class="n" text-anchor="middle">suction iso</text>
<circle cx="450" cy="540" r="28" fill="#c8f0c8" stroke="#000" stroke-width="2"/>
<polygon points="442,524 468,540 442,556" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="450" y="502" class="tb" text-anchor="middle">P-601A</text>
<text x="450" y="590" class="n" text-anchor="middle">RUNNING (duty)</text>
<polyline class="p" points="478,540 700,540"/>
<polygon class="v" points="532,532 548,540 532,548"/><line class="v" x1="548" y1="532" x2="548" y2="548"/>
<text x="540" y="524" class="t" text-anchor="middle">CV-601A</text>
<polygon class="v" points="610,532 630,548 630,532 610,548"/>
<text x="620" y="524" class="t" text-anchor="middle">HV-602A</text>
<text x="620" y="562" class="n" text-anchor="middle">disch. iso</text>

<!-- pump B (standby) -->
<polyline class="p" points="320,680 422,680"/>
<circle cx="320" cy="680" r="4" fill="#000"/>
<polygon class="v" points="360,672 380,688 380,672 360,688"/>
<text x="370" y="664" class="t" text-anchor="middle">HV-601B</text>
<text x="370" y="702" class="n" text-anchor="middle">suction iso</text>
<circle cx="450" cy="680" r="28" fill="#fff" stroke="#000" stroke-width="2"/>
<polygon points="442,664 468,680 442,696" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="450" y="642" class="tb" text-anchor="middle">P-601B</text>
<text x="450" y="730" class="n" text-anchor="middle">STANDBY (stopped)</text>
<polyline class="p" points="478,680 700,680"/>
<polygon class="v" points="532,672 548,680 532,688"/><line class="v" x1="548" y1="672" x2="548" y2="688"/>
<text x="540" y="664" class="t" text-anchor="middle">CV-601B</text>
<polygon class="v" points="610,672 630,688 630,672 610,688"/>
<text x="620" y="664" class="t" text-anchor="middle">HV-602B</text>
<text x="620" y="702" class="n" text-anchor="middle">disch. iso</text>

<!-- discharge header and supply -->
<polyline class="p" points="700,680 700,285 900,285" marker-end="url(#ar)"/>
<circle cx="700" cy="540" r="4" fill="#000"/>
<text x="710" y="420" class="n">CW supply</text>

<!-- E-601 -->
<rect x="900" y="240" width="110" height="110" fill="#fdf3e0" stroke="#000" stroke-width="2.5"/>
<g stroke="#c88" stroke-width="2">
<line x1="915" y1="250" x2="915" y2="340"/><line x1="930" y1="250" x2="930" y2="340"/><line x1="945" y1="250" x2="945" y2="340"/>
<line x1="960" y1="250" x2="960" y2="340"/><line x1="975" y1="250" x2="975" y2="340"/><line x1="990" y1="250" x2="990" y2="340"/>
</g>
<text x="955" y="232" class="tb" text-anchor="middle">E-601 Plate HX</text>
<polyline class="p" points="1200,330 1010,330" marker-end="url(#ar)"/>
<polyline class="p" points="900,330 780,330" marker-end="url(#ar)"/>
<text x="1200" y="350" class="n" text-anchor="end">BL-601 Process in (hot)</text>
<text x="780" y="352" class="n" text-anchor="end">BL-602 Process out (cooled)</text>

<!-- TT-601 / TIC-601 loop -->
<line x1="800" y1="285" x2="800" y2="245" stroke="#000"/>
<circle cx="800" cy="219" r="26" fill="#fff" stroke="#000" stroke-width="1.5"/>
<line x1="774" y1="219" x2="826" y2="219" stroke="#000"/>
<text x="800" y="214" class="tb" text-anchor="middle">TT</text><text x="800" y="235" class="tb" text-anchor="middle">601</text>
<circle cx="600" cy="150" r="26" fill="#fff" stroke="#000" stroke-width="1.5"/>
<line x1="574" y1="150" x2="626" y2="150" stroke="#000"/>
<text x="600" y="145" class="tb" text-anchor="middle">TIC</text><text x="600" y="166" class="tb" text-anchor="middle">601</text>
<polyline class="s" points="800,193 800,150 626,150" marker-end="url(#as)"/>
<polyline class="s" points="574,150 480,150 480,228 416,228" marker-end="url(#as)"/>
<text x="715" y="142" class="n" text-anchor="middle">temp signal</text>
<text x="527" y="142" class="n" text-anchor="middle">output</text>

<!-- operating profile -->
<rect x="780" y="440" width="590" height="340" fill="#fafafa" stroke="#666"/>
<text x="795" y="462" class="tb">Operating profile over the day (illustrative)</text>
<g stroke="#ddd">
<line x1="900" y1="480" x2="900" y2="745"/><line x1="1010" y1="480" x2="1010" y2="745"/><line x1="1120" y1="480" x2="1120" y2="745"/>
<line x1="1185" y1="480" x2="1185" y2="745"/><line x1="1230" y1="480" x2="1230" y2="745"/><line x1="1340" y1="480" x2="1340" y2="745"/>
</g>
<g class="n" text-anchor="middle">
<text x="900" y="762">00:00</text><text x="1010" y="762">06:00</text><text x="1120" y="762">12:00</text>
<text x="1175" y="762">15:00</text><text x="1240" y="762">18:00</text><text x="1340" y="762">24:00</text>
</g>
<text x="795" y="510" class="tb">P-601A</text>
<rect x="900" y="495" width="440" height="22" fill="#c8f0c8" stroke="#000"/>
<text x="1120" y="511" class="t" text-anchor="middle">RUNNING 00:00 - 24:00</text>
<text x="795" y="560" class="tb">P-601B</text>
<rect x="900" y="545" width="440" height="22" fill="#fff" stroke="#000" stroke-dasharray="4 3"/>
<text x="1120" y="561" class="n" text-anchor="middle">STANDBY (stopped)</text>
<text x="795" y="620" class="tb">TV-601</text>
<text x="795" y="634" class="n">bypass flow</text>
<line x1="900" y1="720" x2="1340" y2="720" stroke="#000"/>
<rect x="992" y="660" width="36" height="60" fill="#7fb2e5" stroke="#000"/>
<text x="1010" y="654" class="tb" text-anchor="middle">~60% open</text>
<rect x="1157" y="700" width="36" height="20" fill="#7fb2e5" stroke="#000"/>
<text x="1175" y="694" class="tb" text-anchor="middle">~20% open</text>
<text x="1010" y="735" class="n" text-anchor="middle">06:00 cooler: more bypass</text>
<text x="1200" y="735" class="n" text-anchor="middle">15:00 hotter: less bypass</text>

<text x="20" y="780" class="n">Legend: solid black = process line; dashed blue = signal; TT temperature transmitter; TIC temperature indicating controller; HV hand valve; CV check valve; TV temperature control valve</text>
</svg>
