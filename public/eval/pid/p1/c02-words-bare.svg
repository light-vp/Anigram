<text x="612" y="266" font-weight="bold">PIZ-275003A</text>
<text x="612" y="406" font-weight="bold">PIZ-275003B</text>
<text x="640" y="331" text-anchor="middle" font-size="10">pressure transmitter</text>
<text x="640" y="471" text-anchor="middle" font-size="10">pressure transmitter</text>
<text x="950" y="432" text-anchor="middle" font-weight="bold">PISZA-275003</text>
<text x="950" y="448" text-anchor="middle" font-size="10">High-pressure safety function</text>
<text x="950" y="462" text-anchor="middle" font-size="10">I = indicate · S = switch</text>
<text x="950" y="476" text-anchor="middle" font-size="10">Z = trip (interlock) · A = alarm</text>
<!-- signals -->
<g fill="none" stroke="#000" stroke-dasharray="6 3" stroke-width="1.5" marker-end="url(#ar)">
<path d="M662 300L720 300L720 364L916 364"/>
<path d="M662 440L720 440L720 384L916 384"/>
