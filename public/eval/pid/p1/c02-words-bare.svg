<path d="M304 112V128M304 292V308M304 432V448M304 632V648"/>
</g>
<g font-weight="bold">
<text x="308" y="108">N3</text><text x="308" y="288">P3</text><text x="308" y="428">P4</text><text x="308" y="628">N2</text>
</g>
