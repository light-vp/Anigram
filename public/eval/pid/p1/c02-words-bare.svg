<g fill="#fff" stroke="#000"><rect x="1000" y="290" width="125" height="40"/><rect x="1000" y="420" width="125" height="40"/></g>
<g fill="none" stroke="#000" stroke-dasharray="6 3" stroke-width="1.5" marker-end="url(#ar)">
<path d="M966 346L1000 316"/><path d="M966 402L1000 436"/>
</g>
<g font-size="10" text-anchor="middle">
<text x="1062" y="307">TRIP – interlock</text><text x="1062" y="320">on HIGH pressure</text>
<text x="1062" y="437">ALARM</text><text x="1062" y="450">HIGH column pressure</text>
</g>
<!-- legend -->
<g font-size="10">
<line x1="20" y1="720" x2="60" y2="720" stroke="#000" stroke-width="2"/><text x="66" y="724">process line</text>
<line x1="160" y1="720" x2="200" y2="720" stroke="#000" stroke-dasharray="6 3" stroke-width="1.5"/><text x="206" y="724">signal</text>
<text x="300" y="724">Tags of valves, flanges, tee, reducer and off-sheet N3 connector (…-2750-nn) are placeholders assigned for this drawing. Not to scale.</text>
</g>
