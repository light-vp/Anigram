<g fill="#fff" stroke="#000" stroke-width="1.5">
<polygon points="392,160 408,180 392,180 408,160"/>
<polygon points="370,292 390,308 390,292 370,308"/>
<polygon points="370,432 390,448 390,432 370,448"/>
</g>
