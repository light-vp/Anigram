<rect x="200" y="80" width="100" height="600" rx="40" id="K-2750"/>
<rect x="200" y="190" width="100" height="380" fill="url(#pk)" stroke-width="1.5" id="KX-2750"/>
<!-- N3 -->
<path d="M300 120H560M400 120V230" marker-end="url(#ar)"/>
<!-- P3 -->
<path d="M300 300H618M335 300V275M430 300V325"/>
<!-- P4 -->
<path d="M300 440H618M335 440V415M430 440V465"/>
