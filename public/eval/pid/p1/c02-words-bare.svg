<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="Arial, sans-serif" font-size="12">
<defs>
<pattern id="pk" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 10L10 0M0 0L10 10" stroke="#888" stroke-width="0.8"/></pattern>
<marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#000"/></marker>
</defs>
<rect width="1200" height="760" fill="#fff"/>
<text x="20" y="28" font-size="16" font-weight="bold">P&amp;ID – Packed column K-2750</text>
<g fill="none" stroke="#000" stroke-width="2">
