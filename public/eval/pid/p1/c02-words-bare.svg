<path d="M327 275H343M327 270H343M422 325H438M422 330H438M327 415H343M327 410H343M422 465H438M422 470H438"/>
</g>
<!-- labels left -->
<text x="40" y="130" font-size="14" font-weight="bold">K-2750</text>
<text x="40" y="146">Packed column</text>
<text x="40" y="340" font-weight="bold">KX-2750</text>
<text x="40" y="356">Packed section</text>
<text x="40" y="372">14 m tall, 500 mm ID</text>
<!-- valve / flange tags -->
<g font-size="10">
<text x="412" y="168">V-2750-01</text><text x="412" y="182">isolating valve</text>
<text x="412" y="116">TEE-2750-01</text>
<text x="360" y="325">V-2750-02</text><text x="360" y="338">root valve</text>
<text x="360" y="465">V-2750-03</text><text x="360" y="478">root valve</text>
<text x="280" y="262">BF-2750-01</text><text x="440" y="342">BF-2750-02</text>
<text x="280" y="402">BF-2750-03</text><text x="440" y="482">BF-2750-04</text>
<text x="330" y="672">RED-2750-01</text>
<text x="330" y="686">reducer</text>
<text x="408" y="236">isolated end (downstream not specified)</text>
