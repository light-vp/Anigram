<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Arial, sans-serif" font-size="12">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
    <marker id="sarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c00"/></marker>
  </defs>
  <rect width="1000" height="560" fill="#fff"/>
  <text x="500" y="28" text-anchor="middle" font-size="18" font-weight="bold">P&amp;ID – Product Cooler E-201</text>

  <!-- process piping -->
  <g stroke="#000" stroke-width="2.5" fill="none">
    <!-- product in / out (tube side) -->
    <line x1="110" y1="290" x2="320" y2="290" marker-end="url(#arr)"/>
    <line x1="680" y1="290" x2="880" y2="290" marker-end="url(#arr)"/>
    <!-- CW supply -->
    <polyline points="110,480 600,480 600,334" marker-end="url(#arr)"/>
    <!-- CW return -->
    <polyline points="400,246 400,90 110,90" marker-end="url(#arr)"/>
    <!-- relief -->
    <line x1="560" y1="250" x2="560" y2="200" marker-end="url(#arr)"/>
  </g>

  <!-- exchanger -->
  <g stroke="#000" stroke-width="2" fill="#fff">
    <rect x="350" y="250" width="300" height="80"/>
    <path d="M350,250 Q315,290 350,330 Z"/>
    <path d="M650,250 Q685,290 650,330 Z"/>
  </g>
  <g stroke="#000" stroke-width="1" stroke-dasharray="6,3">
    <line x1="350" y1="270" x2="650" y2="270"/>
    <line x1="350" y1="290" x2="650" y2="290"/>
    <line x1="350" y1="310" x2="650" y2="310"/>
  </g>
  <text x="500" y="346" text-anchor="middle" font-weight="bold" font-size="14">E-201</text>
  <text x="500" y="362" text-anchor="middle">Product cooler (shell &amp; tube)</text>
  <text x="500" y="244" text-anchor="middle" font-size="10" fill="#444" transform="translate(0,0)"> </text>
  <text x="440" y="304" font-size="10" fill="#444">TUBE SIDE: product</text>
  <text x="440" y="324" font-size="10" fill="#444">SHELL SIDE: cooling water</text>

  <!-- isolating valves -->
  <g stroke="#000" stroke-width="2" fill="#fff">
    <polygon points="592,392 608,392 592,408 608,408"/>
    <polygon points="392,207 408,207 392,223 408,223"/>
    <!-- control valve body -->
    <polygon points="392,152 408,152 392,168 408,168"/>
    <!-- PSV (angle relief symbol) -->
    <polygon points="552,214 568,214 560,230"/>
    <polyline points="552,214 568,214" />
  </g>
  <text x="616" y="404" font-weight="bold">V-201</text>
  <text x="616" y="418" font-size="10">CW supply isolation</text>
  <text x="340" y="219" font-weight="bold" text-anchor="end">V-202</text>
  <text x="340" y="233" font-size="10" text-anchor="end">CW return isolation</text>

  <!-- TV-201 actuator -->
  <line x1="400" y1="160" x2="425" y2="160" stroke="#000" stroke-width="2"/>
  <path d="M416,160 A12,12 0 0 1 440,160 Z" fill="#fff" stroke="#000" stroke-width="2" transform="rotate(-90 428 160) translate(0,0)"/>
  <text x="340" y="148" font-weight="bold" text-anchor="end">TV-201</text>
  <text x="340" y="162" font-size="10" text-anchor="end">CW return control valve</text>
  <text x="340" y="176" font-size="10" text-anchor="end">Fail open (FO)</text>

  <!-- PSV -->
  <text x="578" y="224" font-weight="bold">PSV-201</text>
  <text x="578" y="238" font-size="10">Shell-side thermal relief</text>
  <text x="560" y="192" text-anchor="middle" font-size="10">to safe location</text>

  <!-- instruments -->
  <g stroke="#000" stroke-width="1.5" fill="#fff">
    <circle cx="760" cy="240" r="18"/>
    <circle cx="760" cy="160" r="22"/>
  </g>
  <line x1="760" y1="258" x2="760" y2="290" stroke="#000" stroke-width="1.5"/>
  <line x1="742" y1="160" x2="738" y2="160" stroke="#000"/>
  <line x1="738" y1="160" x2="738" y2="160" stroke="#000"/>
  <line x1="738" y1="160" x2="782" y2="160" stroke="#000" stroke-width="1"/>
  <text x="760" y="244" text-anchor="middle" font-size="11" font-weight="bold">TT</text>
  <text x="760" y="156" text-anchor="middle" font-size="11" font-weight="bold">TIC</text>
  <text x="760" y="172" text-anchor="middle" font-size="9">201</text>
  <text x="784" y="244" font-weight="bold">TT-201</text>
  <text x="784" y="258" font-size="10">Product outlet temperature</text>
  <text x="790" y="150" font-weight="bold">TIC-201</text>
  <text x="790" y="164" font-size="10">Temperature controller</text>
  <text x="790" y="178" font-size="10">(opens TV-201 as temp rises)</text>

  <!-- signals (dashed) -->
  <g stroke="#c00" stroke-width="1.5" stroke-dasharray="6,4" fill="none">
    <line x1="760" y1="222" x2="760" y2="182" marker-end="url(#sarr)"/>
    <line x1="738" y1="160" x2="442" y2="160" marker-end="url(#sarr)"/>
  </g>

  <!-- off-sheet connections -->
  <g stroke="#000" stroke-width="1.5" fill="#fff">
    <polygon points="30,276 100,276 112,290 100,304 30,304"/>
    <polygon points="30,76 100,76 112,90 100,104 30,104"/>
    <polygon points="30,466 100,466 112,480 100,494 30,494"/>
    <polygon points="880,276 950,276 962,290 950,304 880,304" transform="translate(0,0)"/>
  </g>
  <text x="62" y="294" text-anchor="middle" font-size="10">PROD-IN</text>
  <text x="62" y="94" text-anchor="middle" font-size="10">CWR-HDR</text>
  <text x="62" y="484" text-anchor="middle" font-size="10">CWS-HDR</text>
  <text x="915" y="294" text-anchor="middle" font-size="10">PROD-OUT</text>
  <text x="30" y="268" font-size="10">Hot product from upstream (off sheet)</text>
  <text x="30" y="68" font-size="10">Cooling water return header (off sheet)</text>
  <text x="30" y="512" font-size="10">Cooling water supply header (off sheet)</text>
  <text x="880" y="268" font-size="10">To storage (off sheet)</text>

  <!-- flow annotation -->
  <text x="250" y="310" font-size="10" fill="#444">hot product</text>
  <text x="700" y="310" font-size="10" fill="#444">cooled product</text>

  <!-- legend -->
  <g font-size="10" transform="translate(700,440)">
    <line x1="0" y1="10" x2="40" y2="10" stroke="#000" stroke-width="2.5"/><text x="48" y="14">Process line</text>
    <line x1="0" y1="30" x2="40" y2="30" stroke="#c00" stroke-width="1.5" stroke-dasharray="6,4"/><text x="48" y="34">Instrument signal</text>
  </g>
</svg>
