<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="Arial, sans-serif" font-size="12">
  <rect width="900" height="620" fill="#fff"/>
  <text x="450" y="595" text-anchor="middle" font-size="16" font-weight="bold">P&amp;ID - Production Separator V-701</text>

  <g fill="none" stroke="#000" stroke-width="2">
    <!-- process lines -->
    <path d="M110 300H150M190 300H330"/>                       <!-- well fluid -> SDV -> V-701 -->
    <path d="M420 140V100H580M620 100H800"/>                   <!-- gas out -> PV-701 -> gas header -->
    <path d="M400 460V520H580M620 520H800"/>                   <!-- liquid out -> LV-701 -> oil line -->
    <path d="M360 140V110M360 80V40H120"/>                     <!-- PSV-701 -> flare -->
    <!-- instrument taps -->
    <path d="M470 200H520M470 330H520M330 200H260" stroke-width="1"/>
  </g>

  <!-- vessel -->
  <rect x="330" y="140" width="140" height="320" rx="40" fill="#f4f4f4" stroke="#000" stroke-width="3"/>
  <text x="400" y="290" text-anchor="middle" font-weight="bold" font-size="14">V-701</text>
  <text x="400" y="306" text-anchor="middle">Production separator</text>
  <path d="M332 380H468" stroke="#06c" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="400" y="400" text-anchor="middle" fill="#06c">liquid level</text>

  <!-- off-sheet connectors -->
  <g fill="#fff" stroke="#000" stroke-width="1.5">
    <rect x="20" y="285" width="90" height="30"/>
    <rect x="20" y="25" width="100" height="30"/>
    <rect x="800" y="85" width="80" height="30"/>
    <rect x="800" y="505" width="80" height="30"/>
  </g>
  <g text-anchor="middle">
    <text x="65" y="304">WELL-FLUID</text>
    <text x="70" y="44">FLARE</text>
    <text x="840" y="104">GAS-HDR</text>
    <text x="840" y="524">OIL-LINE</text>
  </g>
  <text x="65" y="330" text-anchor="middle" font-size="10">from off sheet</text>
  <text x="70" y="70" text-anchor="middle" font-size="10">to flare</text>
  <text x="840" y="132" text-anchor="middle" font-size="10">to gas header</text>
  <text x="840" y="552" text-anchor="middle" font-size="10">to oil line</text>

  <!-- valves (bowtie bodies) -->
  <g fill="#fff" stroke="#000" stroke-width="2">
    <polygon points="150,288 190,312 190,288 150,312"/>
    <polygon points="580,88 620,112 620,88 580,112"/>
    <polygon points="580,508 620,532 620,508 580,532"/>
    <polygon points="348,80 372,80 348,110 372,110"/>
  </g>
  <!-- actuators -->
  <g fill="#fff" stroke="#000" stroke-width="1.5">
    <path d="M170 300V275M600 100V122M600 520V498"/>
    <circle cx="170" cy="267" r="8"/>
    <circle cx="600" cy="130" r="8"/>
    <circle cx="600" cy="490" r="8"/>
  </g>
  <g font-weight="bold">
    <text x="170" y="340" text-anchor="middle">SDV-701</text>
    <text x="170" y="354" text-anchor="middle" font-weight="normal" font-size="10">Inlet shutdown valve (fail closed)</text>
    <text x="600" y="75" text-anchor="middle">PV-701</text>
    <text x="600" y="565" text-anchor="middle">LV-701</text>
    <text x="388" y="75" text-anchor="end">PSV-701</text>
  </g>
  <text x="388" y="62" text-anchor="end" font-size="10">Relief to flare</text>

  <!-- instrument bubbles -->
  <g fill="#fff" stroke="#000" stroke-width="1.5">
    <circle cx="540" cy="200" r="20"/>
    <circle cx="680" cy="200" r="20"/>
    <circle cx="540" cy="330" r="20"/>
    <circle cx="680" cy="330" r="20"/>
    <circle cx="240" cy="200" r="20"/>
  </g>
  <g text-anchor="middle" font-size="10">
    <text x="540" y="198">PT</text><text x="540" y="210">701</text>
    <text x="680" y="198">PIC</text><text x="680" y="210">701</text>
    <text x="540" y="328">LT</text><text x="540" y="340">701</text>
    <text x="680" y="328">LIC</text><text x="680" y="340">701</text>
    <text x="240" y="196">LSHH</text><text x="240" y="208">702</text>
  </g>
  <!-- DCS controller bars -->
  <path d="M660 200H700M660 330H700" stroke="#000" stroke-width="1"/>
  <g font-size="10" text-anchor="middle">
    <text x="540" y="238">Pressure transmitter</text>
    <text x="680" y="238">Pressure controller</text>
    <text x="540" y="368">Level transmitter</text>
    <text x="680" y="368">Level controller</text>
    <text x="240" y="238">High-high level switch</text>
    <text x="240" y="250">(independent nozzle)</text>
  </g>

  <!-- signals (dashed) -->
  <g fill="none" stroke="#c00" stroke-width="1.5" stroke-dasharray="6 4">
    <path d="M560 200H660"/>
    <path d="M680 180V130H608"/>
    <path d="M560 330H660"/>
    <path d="M680 350V490H608"/>
    <path d="M220 200H170V259"/>
  </g>
  <text x="165" y="185" text-anchor="end" fill="#c00" font-size="10">HH: close SDV-701</text>

  <!-- legend -->
  <g font-size="10">
    <path d="M30 450H70" stroke="#000" stroke-width="2"/><text x="78" y="454">Process line</text>
    <path d="M30 470H70" stroke="#c00" stroke-width="1.5" stroke-dasharray="6 4"/><text x="78" y="474">Instrument / control signal</text>
    <path d="M30 490H70" stroke="#000" stroke-width="1"/><text x="78" y="494">Instrument tap</text>
  </g>
</svg>
