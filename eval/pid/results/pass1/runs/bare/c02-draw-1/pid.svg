<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 1000" width="1300" height="1000" font-family="Arial, Helvetica, sans-serif">
  <title>P&amp;ID - packed column K 2750 with pressure instrumentation (DEXPI Example C02)</title>
  <defs>
    <marker id="sig" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L8,4 L0,7 Z" fill="#0033cc"/></marker>
  </defs>
  <rect x="0" y="0" width="1300" height="1000" fill="#ffffff"/>
  <rect x="10" y="10" width="1280" height="980" fill="none" stroke="#000" stroke-width="1"/>
  <text x="30" y="34" font-size="16" font-weight="bold">P&amp;ID - Packed column K 2750 with pressure instrumentation</text>

  <!-- ===== COLUMN K 2750 ===== -->
  <g data-tag="K 2750">
    <path d="M640,220 A60,30 0 0 1 760,220 L760,780 A60,30 0 0 1 640,780 Z" fill="#fff" stroke="#000" stroke-width="2.5"/>
    <text x="470" y="275" font-size="18" font-weight="bold">K 2750</text>
    <text x="470" y="290" font-size="10" fill="#555">Column (Kolonne)</text>
    <line x1="540" y1="270" x2="640" y2="262" stroke="#000" stroke-width="1"/>
    <circle cx="640" cy="262" r="2.5" fill="#000"/>
  </g>

  <!-- internals -->
  <g stroke="#666" stroke-width="1.2" fill="none">
    <line x1="634" y1="240" x2="766" y2="240"/>
    <!-- feed (N5) inlet pipe and distributor -->
    <path d="M760,250 L700,250 L700,262"/>
    <line x1="695" y1="255" x2="705" y2="255"/>
    <line x1="695" y1="258" x2="705" y2="258"/>
    <rect x="650" y="262" width="100" height="8"/>
  </g>
  <!-- upper packed bed KX 2750 -->
  <g data-tag="KX 2750">
    <rect x="640" y="272" width="120" height="240" fill="#f3f3f3" stroke="#666" stroke-width="1.2"/>
    <line x1="640" y1="272" x2="760" y2="512" stroke="#666" stroke-width="1.2"/>
    <line x1="760" y1="272" x2="640" y2="512" stroke="#666" stroke-width="1.2"/>
    <text x="470" y="370" font-size="18" font-weight="bold">KX 2750</text>
    <text x="470" y="385" font-size="10" fill="#555">Column section (packed bed)</text>
    <line x1="545" y1="365" x2="640" y2="365" stroke="#000" stroke-width="1" stroke-dasharray="3,2"/>
    <circle cx="640" cy="365" r="2.5" fill="#000"/>
  </g>
  <g stroke="#666" stroke-width="1.2" fill="none">
    <line x1="634" y1="547" x2="766" y2="547"/>
    <path d="M648,552 L648,557 L752,557 L752,552"/>
    <line x1="700" y1="557" x2="700" y2="561"/>
    <rect x="648" y="561" width="104" height="10"/>
  </g>
  <!-- lower packed bed -->
  <g data-tag="SubTaggedColumnSection-1">
    <rect x="640" y="580" width="120" height="120" fill="#f3f3f3" stroke="#666" stroke-width="1.2"/>
    <line x1="640" y1="580" x2="760" y2="700" stroke="#666" stroke-width="1.2"/>
    <line x1="760" y1="580" x2="640" y2="700" stroke="#666" stroke-width="1.2"/>
    <text x="632" y="636" font-size="9" fill="#777" text-anchor="end">SubTaggedColumnSection-1</text>
    <text x="632" y="647" font-size="9" fill="#777" text-anchor="end">(packed bed, no tag in source)</text>
  </g>
  <g stroke="#666" stroke-width="1.2" fill="none">
    <line x1="634" y1="725" x2="766" y2="725"/>
    <!-- sump liquid level and 1000 mm dimension -->
    <line x1="648" y1="765" x2="752" y2="765"/>
    <path d="M693,758 L707,758 L700,765 Z" fill="#666"/>
    <!-- baffle plate in front of N4 -->
    <line x1="745" y1="743" x2="745" y2="765" stroke-width="2"/>
    <!-- vortex breaker at outlet -->
    <line x1="692" y1="802" x2="708" y2="802"/>
    <line x1="695" y1="802" x2="695" y2="810"/>
    <line x1="705" y1="802" x2="705" y2="810"/>
  </g>
  <g stroke="#666" stroke-width="1" fill="#666">
    <line x1="668" y1="765" x2="668" y2="810"/>
    <line x1="660" y1="810" x2="700" y2="810"/>
    <path d="M668,765 L665,772 L671,772 Z"/>
    <path d="M668,810 L665,803 L671,803 Z"/>
  </g>
  <text x="662" y="792" font-size="10" text-anchor="end">1000</text>
  <text x="700" y="737" font-size="9" text-anchor="middle">Mit Prallblech</text>
  <text x="700" y="797" font-size="9" text-anchor="middle">16)</text>

  <!-- ===== NOZZLES (K 2750) ===== -->
  <g stroke="#000" stroke-width="2" fill="none">
    <!-- N1 top outlet DN200 -->
    <g data-tag="N1"><line x1="700" y1="190" x2="700" y2="180"/><line x1="691" y1="180" x2="709" y2="180"/></g>
    <!-- N3 bottom outlet DN150 -->
    <g data-tag="N3"><line x1="700" y1="810" x2="700" y2="822"/><line x1="692" y1="822" x2="708" y2="822"/></g>
    <!-- N5 feed DN50 -->
    <g data-tag="N5"><line x1="760" y1="250" x2="790" y2="250"/><line x1="790" y1="243" x2="790" y2="257"/></g>
    <!-- N4 DN200 -->
    <g data-tag="N4"><line x1="760" y1="743" x2="790" y2="743"/><line x1="790" y1="735" x2="790" y2="751"/></g>
    <!-- N2 DN150 -->
    <g data-tag="N2"><line x1="640" y1="542" x2="610" y2="542"/><line x1="610" y1="535" x2="610" y2="549"/></g>
    <!-- N7 DN50 -->
    <g data-tag="N7"><line x1="640" y1="768" x2="610" y2="768"/><line x1="610" y1="761" x2="610" y2="775"/></g>
    <!-- H1 manhole DN250 -->
    <g data-tag="H1">
      <line x1="640" y1="735" x2="624" y2="735"/><line x1="640" y1="745" x2="624" y2="745"/>
      <line x1="624" y1="730" x2="624" y2="750"/><line x1="620" y1="730" x2="620" y2="750"/>
    </g>
    <!-- P3 / P4 pressure tapping nozzles DN80 on the tapping bar -->
    <line x1="495" y1="230" x2="640" y2="230" stroke-width="4"/>
    <g data-tag="P3"><line x1="520" y1="230" x2="520" y2="216"/><line x1="514" y1="216" x2="526" y2="216"/></g>
    <g data-tag="P4"><line x1="620" y1="230" x2="620" y2="216"/><line x1="614" y1="216" x2="626" y2="216"/></g>
  </g>
  <g font-size="10" text-anchor="middle">
    <text x="718" y="188" text-anchor="start">N1 / 200</text>
    <text x="718" y="826" text-anchor="start">N3 / 150</text>
    <text x="775" y="242">N5</text><text x="775" y="266">50</text>
    <text x="775" y="735">N4</text><text x="775" y="759">200</text>
    <text x="625" y="534">N2</text><text x="625" y="558">150</text>
    <text x="625" y="788">N7</text><text x="625" y="800">50</text>
    <text x="614" y="738" text-anchor="end">H1</text><text x="614" y="750" text-anchor="end">250</text>
    <text x="508" y="212" text-anchor="end">P3</text><text x="508" y="222" text-anchor="end">80</text>
    <text x="608" y="212" text-anchor="end">P4</text><text x="608" y="222" text-anchor="end">80</text>
  </g>

  <!-- ===== TOP OUTLET LINE (N1 -> 2765), DN200 / DN150 ===== -->
  <g stroke="#000" fill="none">
    <line x1="700" y1="180" x2="700" y2="176" stroke-width="3.2"/>
    <polygon points="690,176 710,176 700,158" stroke-width="1.8" fill="#fff" data-tag="PipeReducer-1"/>
    <path d="M700,158 L700,120 L1040,120" stroke-width="2.6"/>
    <!-- insulation symbol -->
    <g stroke-width="1" data-note="insulation B40">
      <line x1="880" y1="113" x2="940" y2="113"/><line x1="880" y1="127" x2="940" y2="127"/>
      <line x1="880" y1="127" x2="890" y2="113"/><line x1="895" y1="127" x2="905" y2="113"/>
      <line x1="910" y1="127" x2="920" y2="113"/><line x1="925" y1="127" x2="935" y2="113"/>
    </g>
    <!-- slope symbol -->
    <path d="M790,134 L790,128 L810,134 Z" stroke-width="1" fill="#000"/>
    <!-- flow direction -->
    <path d="M696,148 L700,140 L704,148" stroke-width="1.5"/>
    <path d="M760,116 L768,120 L760,124" stroke-width="1.5"/>
  </g>
  <g font-size="10">
    <text x="718" y="166">200/150</text>
    <text x="718" y="177" font-size="8" fill="#777">PipeReducer-1</text>
    <text x="710" y="142" font-size="10">DN 200 | DN 150</text>
    <text x="760" y="108" font-size="10">2750.001.6-0N-2170.8503-150/10HB25T10B1-B40-</text>
    <text x="820" y="141">1%</text>
    <text x="910" y="141" text-anchor="middle" font-size="9" fill="#555">insulated (B40)</text>
  </g>
  <!-- off-page connector 2765 -->
  <g data-tag="2765">
    <polygon points="1040,110 1040,130 1060,130 1060,140 1080,120 1060,100 1060,110" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="1060" y="92" font-size="11" text-anchor="middle">2765</text>
    <text x="1060" y="156" font-size="10" text-anchor="middle">2750.001</text>
    <text x="1090" y="124" font-size="11">W 2765</text>
  </g>

  <!-- ===== BOTTOM OUTLET (N3) with tee, DN150 + DN80 branch ===== -->
  <g stroke="#000" fill="none">
    <line x1="700" y1="822" x2="700" y2="930" stroke-width="2.6"/>
    <path d="M696,838 L700,846 L704,838" stroke-width="1.5"/>
    <line x1="700" y1="860" x2="540" y2="860" stroke-width="2.2"/>
    <path d="M668,856 L660,860 L668,864" stroke-width="1.5"/>
    <!-- valve H672B1V (horizontal bowtie) -->
    <path d="M610,854 L610,866 L630,854 L630,866 Z" stroke-width="1.8" fill="#fff" data-tag="H672B1V"/>
    <!-- open ends -->
    <line x1="692" y1="930" x2="708" y2="930" stroke-width="1.5"/>
    <line x1="540" y1="853" x2="540" y2="867" stroke-width="1.5"/>
  </g>
  <g font-size="10">
    <text x="620" y="848" text-anchor="middle">H672B1V</text>
    <text x="620" y="882" text-anchor="middle">80</text>
    <text x="620" y="893" text-anchor="middle">AS9</text>
    <text x="712" y="880" font-size="8" fill="#777">PipeTee-1</text>
    <text x="712" y="920">DN 150</text>
    <text x="575" y="852" text-anchor="middle">DN 80</text>
    <text x="700" y="944" font-size="9" fill="#777" text-anchor="middle">open end (no continuation in source)</text>
    <text x="536" y="852" font-size="9" fill="#777" text-anchor="end">open end</text>
  </g>

  <!-- ===== PRESSURE TAPPINGS P3 and P4 ===== -->
  <g stroke="#000" fill="none">
    <!-- P3 stack at x=520 -->
    <line x1="520" y1="216" x2="520" y2="204" stroke-width="2.2"/>
    <line x1="520" y1="204" x2="520" y2="150" stroke-width="1.6"/>
    <line x1="512" y1="204" x2="528" y2="204" stroke-width="2.5" data-tag="BlindFlange-1"/>
    <path d="M514,166 L526,166 L514,190 L526,190 Z" stroke-width="1.6" fill="#fff" data-tag="H658B1UV (OperatedValve-2)"/>
    <line x1="512" y1="150" x2="528" y2="150" stroke-width="2.5" data-tag="BlindFlange-2"/>
    <line x1="520" y1="150" x2="520" y2="124" stroke-width="1.1"/>
    <!-- P4 stack at x=620 -->
    <line x1="620" y1="216" x2="620" y2="204" stroke-width="2.2"/>
    <line x1="620" y1="204" x2="620" y2="150" stroke-width="1.6"/>
    <line x1="612" y1="204" x2="628" y2="204" stroke-width="2.5" data-tag="BlindFlange-3"/>
    <path d="M614,166 L626,166 L614,190 L626,190 Z" stroke-width="1.6" fill="#fff" data-tag="H658B1UV (OperatedValve-3)"/>
    <line x1="612" y1="150" x2="628" y2="150" stroke-width="2.5" data-tag="BlindFlange-4"/>
    <line x1="620" y1="150" x2="620" y2="124" stroke-width="1.1"/>
  </g>
  <g font-size="10">
    <!-- valve 2 labels (left) -->
    <g text-anchor="end">
      <text x="508" y="170">H658B1UV</text>
      <text x="508" y="181">2170.8503</text>
      <text x="508" y="192">25</text>
      <text x="508" y="203">AS9</text>
    </g>
    <!-- valve 3 labels (gap between stacks, right-aligned) -->
    <g text-anchor="end">
      <text x="608" y="170">H658B1UV</text>
      <text x="608" y="181">2170.8503</text>
      <text x="608" y="192">25</text>
      <text x="608" y="203">AS9</text>
    </g>
    <text x="532" y="207">80/25</text>
    <text x="532" y="216" font-size="8" fill="#777">BlindFlange-1</text>
    <text x="632" y="207">80/25</text>
    <text x="632" y="216" font-size="8" fill="#777">BlindFlange-3</text>
    <text x="528" y="146" font-size="8" fill="#777">BlindFlange-2</text>
    <text x="628" y="146" font-size="8" fill="#777">BlindFlange-4</text>
    <text x="528" y="138" font-size="8" fill="#777">measuring point</text>
    <text x="628" y="138" font-size="8" fill="#777">measuring point</text>
    <text x="540" y="130" font-size="8" fill="#555">measuring line</text>
  </g>
  <!-- SP boxes -->
  <g font-size="9" fill="none" stroke="#000" stroke-width="1">
    <rect x="388" y="165" width="52" height="28"/>
    <rect x="634" y="165" width="52" height="28"/>
  </g>
  <g font-size="9" text-anchor="middle">
    <text x="414" y="176">SP</text><text x="414" y="187">2750-5</text>
    <text x="660" y="176">SP</text><text x="660" y="187">2750-6</text>
    <text x="414" y="205">1)</text>
    <text x="660" y="205">1)</text>
  </g>

  <!-- ===== INSTRUMENT FUNCTIONS (central location) ===== -->
  <g data-tag="PI(Z) 275003A" stroke="#000" stroke-width="1.5" fill="#fff">
    <circle cx="520" cy="100" r="24"/><line x1="496" y1="100" x2="544" y2="100"/>
  </g>
  <text x="520" y="96" font-size="11" text-anchor="middle">PI(Z)</text>
  <text x="520" y="113" font-size="10" text-anchor="middle">275003A</text>
  <g data-tag="PI(Z) 275003B" stroke="#000" stroke-width="1.5" fill="#fff">
    <circle cx="620" cy="100" r="24"/><line x1="596" y1="100" x2="644" y2="100"/>
  </g>
  <text x="620" y="96" font-size="11" text-anchor="middle">PI(Z)</text>
  <text x="620" y="113" font-size="10" text-anchor="middle">275003B</text>
  <g data-tag="PIS⁺Z⁺A 275003" stroke="#000" stroke-width="1.5" fill="#fff">
    <circle cx="330" cy="100" r="34"/><line x1="296" y1="100" x2="364" y2="100"/>
  </g>
  <text x="330" y="95" font-size="12" text-anchor="middle">PIS⁺Z⁺A</text>
  <text x="330" y="116" font-size="11" text-anchor="middle">275003</text>

  <!-- signals (blue, as in source) -->
  <g stroke="#0033cc" stroke-width="1.2" fill="none">
    <line x1="496" y1="100" x2="365" y2="100" marker-end="url(#sig)"/>
    <path d="M620,76 L620,48 L330,48 L330,65" marker-end="url(#sig)"/>
  </g>

  <!-- ===== EQUIPMENT DATA BLOCKS ===== -->
  <g font-size="10">
    <text x="40" y="880" font-size="16" font-weight="bold">K 2750</text>
    <text x="40" y="896">1 Kolonne</text>
    <text x="40" y="908">⌀ 500 x 14000 mm</text>
    <text x="40" y="920">1.4571</text>
    <text x="40" y="932">pe=6/-1 bar, 150 °C</text>
    <text x="260" y="880" font-size="16" font-weight="bold">KX 2750</text>
    <text x="260" y="896">1 Ventilböden</text>
    <text x="260" y="908">⌀ 600 mm</text>
    <text x="260" y="920">1.4571</text>
  </g>

  <!-- ===== LEGEND AND NOTES ===== -->
  <g font-size="10">
    <rect x="880" y="200" width="390" height="120" fill="none" stroke="#000"/>
    <text x="890" y="216" font-weight="bold">Legend</text>
    <line x1="890" y1="232" x2="930" y2="232" stroke="#000" stroke-width="2.6"/><text x="940" y="236">process pipe</text>
    <line x1="890" y1="250" x2="930" y2="250" stroke="#0033cc" stroke-width="1.2" marker-end="url(#sig)"/><text x="940" y="254">signal line</text>
    <line x1="890" y1="268" x2="930" y2="268" stroke="#000" stroke-width="1.1"/><text x="940" y="272">measuring line (tapping to indicator)</text>
    <path d="M900,284 L900,296 L920,284 L920,296 Z" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="940" y="294">operated valve</text>
    <circle cx="1170" cy="231" r="9" fill="#fff" stroke="#000"/><line x1="1161" y1="231" x2="1179" y2="231" stroke="#000"/>
    <text x="1186" y="235">central-location</text>
    <text x="1186" y="246">instrument</text>
    <line x1="1160" y1="262" x2="1180" y2="262" stroke="#000" stroke-width="2.5"/><text x="1186" y="266">blind flange</text>
    <text x="1170" y="296" font-size="9">⁺ = high</text>
  </g>
  <g font-size="10">
    <rect x="880" y="336" width="390" height="300" fill="none" stroke="#000"/>
    <text x="890" y="352" font-weight="bold">Notes (taken from column.xml)</text>
    <text x="890" y="370">PIS⁺Z⁺A 275003 receives the signals of PI(Z) 275003A</text>
    <text x="890" y="382">and PI(Z) 275003B. Functions as encoded in the source</text>
    <text x="890" y="394">(IS⁺Z⁺A): indicate, switch, Z function, alarm, each</text>
    <text x="890" y="406">for the high side (⁺).</text>
    <text x="890" y="430">Both DN25 tapping valves carry the tag H658B1UV in</text>
    <text x="890" y="442">the source. Kept as written here; pid.json adds the</text>
    <text x="890" y="454">file IDs so the entries stay unique.</text>
    <text x="890" y="478">Footnotes 1) and 16) and the SP 2750-5 / 2750-6</text>
    <text x="890" y="490">boxes appear in the source without further text.</text>
    <text x="890" y="514">The DN150 bottom line and its DN80 branch end</text>
    <text x="890" y="526">without a connection in the source.</text>
    <text x="890" y="550">KX 2750 is drawn as a packed bed (source symbol) but</text>
    <text x="890" y="562">is labelled "1 Ventilböden" and ⌀ 600 mm, while the</text>
    <text x="890" y="574">column chamber is ⌀ 500 mm.</text>
    <text x="890" y="598">Piping fluid code 8503, class 10HB25T10B1,</text>
    <text x="890" y="610">insulation B40, slope 1 % on the DN150 outlet.</text>
    <text x="890" y="622">Nozzles H1, N2, N4, N5, N7 have no piping in the source.</text>
  </g>
  <g font-size="10">
    <rect x="880" y="900" width="390" height="70" fill="none" stroke="#000"/>
    <text x="890" y="920" font-size="13" font-weight="bold">DEXPI Example C02</text>
    <text x="890" y="936">BASF SE, Ludwigshafen - complex V888 - plant V04 - section 2000</text>
    <text x="890" y="950">Source: column.xml (DEXPI 1.3.1, schema 4.1.1)</text>
  </g>
</svg>
