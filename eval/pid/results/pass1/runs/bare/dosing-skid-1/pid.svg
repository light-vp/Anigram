<!-- notes -->
<text x="650" y="330" class="n">FIC-301: SP = dose ratio × main flow;</text>
<text x="650" y="343" class="n">output = stroke speed of duty pump P-301A.</text>
<text x="650" y="356" class="n">On changeover the output transfers to P-301B.</text>
<text x="650" y="372" class="n">LSLL-301 stops both pumps before T-301 runs dry.</text>

