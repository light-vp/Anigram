<!-- notes and title block -->
<text x="40" y="880" font-size="12" font-weight="bold">CONTROL NOTES</text>
<text x="40" y="898" font-size="11">1. HS-4750.01 (control room) opens and shuts on/off valve HV-4750.01 on line 47123 into T-4750.</text>
<text x="40" y="914" font-size="11">2. PICSA-4712.02 (DCS) reads discharge pressure from header 47126 and throttles PV-4712.02 (H-1008 outlet, line 47127) to hold it.</text>
<text x="40" y="930" font-size="11">3. SV-104.01 relieves at 6 barg from header 47126 back to T-4750 on line 47125.</text>
<text x="40" y="946" font-size="11">4. TICSA-4750.03 (DCS) measures the temperature in T-4750 and throttles TV-4750.03 on H-1008 utility outlet 47141.</text>
<text x="40" y="962" font-size="11">† Tag not supplied: provisional, to be confirmed.   Bubble with a line = control room / DCS.   Solid = process line, dashed blue = signal.</text>
