<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" font-family="Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c00"/></marker></defs>
<rect width="1200" height="780" fill="#fff"/><rect x="8" y="8" width="1184" height="764" fill="none" stroke="#000"/>
<text x="20" y="28" font-size="15" font-weight="bold">P&amp;ID - Raw Water Transfer (Tank T-1601 and Transfer Pumps P-1601A/B)</text>

<!-- process lines -->
<g fill="none" stroke="#000" stroke-width="3">
<polyline points="130,150 160,150"/>
<polyline points="180,150 300,150"/>
<polyline points="360,300 360,360 480,360"/>
<polyline points="480,250 480,470"/>
<polyline points="480,250 622,250"/><polyline points="678,250 950,250"/>
<polyline points="480,470 622,470"/><polyline points="678,470 950,470"/>
<polyline points="950,250 950,470"/>
<polyline points="950,360 1060,360"/>
</g>
<circle cx="480" cy="360" r="4"/><circle cx="950" cy="360" r="4"/>

<!-- tank T-1601 -->
<path d="M300,115 Q360,85 420,115 L420,285 Q360,315 300,285 Z" fill="#e8f3ff" stroke="#000" stroke-width="2.5"/>
<line x1="300" y1="125" x2="420" y2="125" stroke="#c00" stroke-dasharray="3,3"/>
<text x="414" y="121" font-size="8" text-anchor="end" fill="#c00">HH</text>
<line x1="300" y1="195" x2="420" y2="195" stroke="#06c" stroke-dasharray="3,3"/>
<text x="414" y="191" font-size="8" text-anchor="end" fill="#06c">normal</text>
<text x="360" y="250" font-size="13" text-anchor="middle" font-weight="bold">T-1601</text>
<text x="360" y="266" font-size="9" text-anchor="middle">Raw water tank</text>

<!-- off-sheet connectors -->
<polygon points="40,136 110,136 130,150 110,164 40,164" fill="#eef" stroke="#000" stroke-width="1.5"/>
<text x="85" y="154" font-size="10" text-anchor="middle" font-weight="bold">OSC-1</text>
<text x="85" y="180" font-size="9" text-anchor="middle">From river intake (off sheet)</text>
<polygon points="1080,346 1150,346 1150,374 1080,374 1060,360" fill="#eef" stroke="#000" stroke-width="1.5"/>
<text x="1115" y="364" font-size="10" text-anchor="middle" font-weight="bold">OSC-2</text>
<text x="1105" y="390" font-size="9" text-anchor="middle">To treatment plant (off sheet)</text>

<!-- LV-1601 control valve -->
<polygon points="160,142 180,158 180,142 160,158" fill="#fff" stroke="#000" stroke-width="2"/>
<path d="M158,132 A12,12 0 0 1 182,132 Z" fill="#fff" stroke="#000" stroke-width="1.5"/>
<line x1="170" y1="132" x2="170" y2="146" stroke="#000" stroke-width="1.5"/>
<text x="150" y="134" font-size="11" text-anchor="end" font-weight="bold">LV-1601</text>
<text x="190" y="182" font-size="9">Intake control valve</text>

<!-- pump train A (duty) -->
<polygon points="540,242 560,258 560,242 540,258" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="550" y="226" font-size="11" text-anchor="middle" font-weight="bold">HV-1601A</text><text x="550" y="284" font-size="9" text-anchor="middle">Suction isolation</text>
<circle cx="650" cy="250" r="28" fill="#fff" stroke="#000" stroke-width="2"/>
<polyline points="636,226 678,250 636,274" fill="none" stroke="#000" stroke-width="2"/>
<text x="650" y="212" font-size="12" text-anchor="middle" font-weight="bold">P-1601A</text><text x="650" y="296" font-size="9" text-anchor="middle">Transfer pump - duty</text>
<circle cx="760" cy="250" r="10" fill="#fff" stroke="#000" stroke-width="2"/><polygon points="756,244 766,250 756,256"/>
<text x="760" y="226" font-size="11" text-anchor="middle" font-weight="bold">NRV-1601A</text><text x="760" y="284" font-size="9" text-anchor="middle">Check valve</text>
<polygon points="840,242 860,258 860,242 840,258" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="850" y="226" font-size="11" text-anchor="middle" font-weight="bold">HV-1602A</text><text x="850" y="284" font-size="9" text-anchor="middle">Discharge isolation</text>

<!-- pump train B (standby) -->
<polygon points="540,462 560,478 560,462 540,478" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="550" y="446" font-size="11" text-anchor="middle" font-weight="bold">HV-1601B</text><text x="550" y="504" font-size="9" text-anchor="middle">Suction isolation</text>
<circle cx="650" cy="470" r="28" fill="#fff" stroke="#000" stroke-width="2"/>
<polyline points="636,446 678,470 636,494" fill="none" stroke="#000" stroke-width="2"/>
<text x="650" y="506" font-size="12" text-anchor="middle" font-weight="bold" dy="24">P-1601B</text><text x="650" y="540" font-size="9" text-anchor="middle" dy="12">Transfer pump - standby</text>
<circle cx="760" cy="470" r="10" fill="#fff" stroke="#000" stroke-width="2"/><polygon points="756,464 766,470 756,476"/>
<text x="760" y="446" font-size="11" text-anchor="middle" font-weight="bold">NRV-1601B</text><text x="760" y="504" font-size="9" text-anchor="middle">Check valve</text>
<polygon points="840,462 860,478 860,462 840,478" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="850" y="446" font-size="11" text-anchor="middle" font-weight="bold">HV-1602B</text><text x="850" y="504" font-size="9" text-anchor="middle">Discharge isolation</text>

<!-- instruments -->
<g fill="#fff" stroke="#000" stroke-width="1.5">
<circle cx="500" cy="150" r="30"/><circle cx="500" cy="50" r="30"/><circle cx="230" cy="240" r="30"/><circle cx="650" cy="360" r="30"/>
</g>
<g font-size="10" text-anchor="middle" font-weight="bold">
<text x="500" y="154">LT-1601</text><text x="500" y="54">LIC-1601</text><text x="230" y="244">LSHH-1602</text><text x="650" y="364">XC-1601</text>
</g>
<g font-size="9" text-anchor="middle">
<text x="500" y="193">Level transmitter</text><text x="500" y="93">Level controller</text>
<text x="230" y="283">Independent high-high trip</text><text x="650" y="403">Standby auto-start</text>
</g>

<!-- signals -->
<g fill="none" stroke="#c00" stroke-width="1.5" stroke-dasharray="6,4">
<polyline points="470,150 420,150"/>
<polyline points="500,120 500,80"/>
<polyline points="470,50 170,50 170,118" marker-end="url(#ar)"/>
<polyline points="300,240 260,240"/>
<polyline points="200,240 170,240 170,160" marker-end="url(#ar)"/>
<polyline points="650,278 650,330" marker-end="url(#ar)"/>
<polyline points="650,390 650,442" marker-end="url(#ar)"/>
</g>
<g font-size="9" fill="#c00">
<text x="185" y="44">level control (modulate)</text>
<text x="178" y="215">trip: force closed</text>
<text x="660" y="308">A trip / stopped</text>
<text x="660" y="425">start B</text>
</g>

<!-- legend -->
<line x1="30" y1="560" x2="80" y2="560" stroke="#000" stroke-width="3"/><text x="90" y="564" font-size="10">Process line</text>
<line x1="30" y1="580" x2="80" y2="580" stroke="#c00" stroke-width="1.5" stroke-dasharray="6,4"/><text x="90" y="584" font-size="10">Signal / interlock</text>

<!-- sequence -->
<rect x="30" y="610" width="1140" height="150" fill="#fafafa" stroke="#000"/>
<text x="40" y="630" font-size="12" font-weight="bold">Operating sequence - duty pump trips (e.g. mid-morning)</text>
<g font-size="10.5">
<text x="40" y="652">1. Normal: P-1601A runs (duty), P-1601B stopped (standby, valves lined up). LT-1601 / LIC-1601 modulate LV-1601 to hold the T-1601 normal level.</text>
<text x="40" y="672">2. P-1601A trips: XC-1601 sees A stopped and starts P-1601B. NRV-1601A stops back-flow through the tripped pump; transfer to the plant resumes.</text>
<text x="40" y="692">3. Until B is up, tank level rises only at the intake rate; LIC-1601 closes LV-1601 as level rises toward setpoint.</text>
<text x="40" y="712">4. Last line of defence: LSHH-1602 (separate switch, independent of LT-1601/LIC-1601) forces LV-1601 closed on high-high, so T-1601 cannot overflow.</text>
<text x="40" y="732">Note: tags HV-/NRV-/XC-/OSC- are assigned here; LT-1601, LIC-1601, LV-1601, LSHH-1602, T-1601, P-1601A/B are as specified. Shows intent; not a sizing or timing proof.</text>
</g>
</svg>
