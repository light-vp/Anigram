<!-- Legend -->
<text x="30" y="820" font-size="12" font-weight="bold">Legend</text>
<line x1="30" y1="834" x2="70" y2="834" stroke="#222" stroke-width="2.5"/>
<text x="78" y="838" font-size="10">process line</text>
<line x1="170" y1="834" x2="210" y2="834" stroke="#1a5fb4" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="218" y="838" font-size="10">signal</text>
<text x="30" y="858" font-size="10" fill="#444">HV = hand valve   CV = check valve   PSV = pressure safety valve   PD = pulsation dampener   CC = calibration column</text>
<text x="30" y="872" font-size="10" fill="#444">LIT / FT = transmitter   FIC = flow indicating controller   LSLL = low-low level switch (interlock)   IP = injection point</text>
<text x="1560" y="872" font-size="10" fill="#444" text-anchor="end">Standby P-301B is isolated by HV-311B / HV-312B and takes over on duty change.</text>
</svg>
