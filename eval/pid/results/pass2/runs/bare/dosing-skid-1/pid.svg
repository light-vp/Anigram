<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="sa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1a5fb4"/></marker></defs>
<rect width="1600" height="880" fill="#fff"/>
<text x="30" y="34" font-size="20" font-weight="bold" fill="#111">Sodium hypochlorite dosing skid - P&amp;ID</text>
<text x="30" y="52" font-size="12" fill="#444">Day tank T-301, duplex diaphragm metering pumps (duty/standby), flow-paced dosing into the treated water main</text>

