<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1000" viewBox="0 0 1920 1000" font-family="Calibri, Arial, sans-serif" font-size="13">
<title>P&amp;ID - DEXPI Example C03 (piping.xml)</title>
<rect x="0" y="0" width="1920" height="1000" fill="#fff" stroke="#000" stroke-width="2"/>

<!-- geometry: drawing space in metres as in piping.xml (8000 px per m, y up) -->
<g transform="translate(0,1000) scale(8000,-8000)" stroke="#000" fill="none" stroke-linejoin="miter">

<!-- process pipe: stub, run through valves, riser to off-page connector -->
<polyline points="0.035,0.0702 0.035,0.057 0.15,0.057 0.15,0.106" stroke-width="0.0005"/>

<!-- stub end: Flange-1, BlindFlange-1, PipeFitting-1 (plug) -->
<line x1="0.03125" y1="0.069" x2="0.03875" y2="0.069" stroke-width="0.00025"/>
<line x1="0.03125" y1="0.0702" x2="0.03875" y2="0.0702" stroke-width="0.00025"/>
<rect x="0.0332" y="0.0704" width="0.0036" height="0.0024" fill="#000" stroke-width="0.00015"/>

<!-- Flange-2, Flange-3 -->
<line x1="0.0672" y1="0.05325" x2="0.0672" y2="0.06075" stroke-width="0.00025"/>
<line x1="0.078" y1="0.05325" x2="0.078" y2="0.06075" stroke-width="0.00025"/>

<!-- OperatedValve-1 -->
<circle cx="0.0726" cy="0.057" r="0.0045" fill="#000" stroke-width="0.00025"/>
<line x1="0.0681" y1="0.0525" x2="0.0681" y2="0.0615" stroke-width="0.00025"/>
<line x1="0.0771" y1="0.0525" x2="0.0771" y2="0.0615" stroke-width="0.00025"/>

<!-- ControlledActuator-1 (electric) -->
<rect x="0.0681" y="0.0678" width="0.009" height="0.009" fill="#fff" stroke-width="0.00019"/>
<line x1="0.0726" y1="0.0615" x2="0.0726" y2="0.0723" stroke-width="0.00019"/>
<line x1="0.0681" y1="0.0723" x2="0.0771" y2="0.0723" stroke-width="0.00019"/>

<!-- RestrictionOrifice-1 -->
<line x1="0.10515" y1="0.05175" x2="0.10515" y2="0.06225" stroke-width="0.00019"/>
<line x1="0.11085" y1="0.05175" x2="0.11085" y2="0.06225" stroke-width="0.00019"/>
<line x1="0.108" y1="0.05805" x2="0.108" y2="0.06225" stroke-width="0.00019"/>
<line x1="0.108" y1="0.05595" x2="0.108" y2="0.05175" stroke-width="0.00019"/>

<!-- BallValve-1 -->
<circle cx="0.1164" cy="0.057" r="0.0045" fill="#fff" stroke-width="0.00025"/>
<line x1="0.1119" y1="0.0525" x2="0.1119" y2="0.0615" stroke-width="0.00025"/>
<line x1="0.1209" y1="0.0525" x2="0.1209" y2="0.0615" stroke-width="0.00025"/>

<!-- PipeReducer-1: 0800 end at x=0.122, 0200 end at x=0.128 -->
<polygon points="0.122,0.0615 0.128,0.0585 0.128,0.0555 0.122,0.0525" fill="#fff" stroke-width="0.00019"/>

<!-- pipe slope symbol, flow arrow, off-page connector -->
<polygon points="0.152,0.0835 0.152,0.0685 0.155,0.0685" stroke-width="0.00015"/>
<polygon points="0.15,0.1055 0.14825,0.0985 0.15175,0.0985" fill="#000" stroke-width="0.0001"/>
<rect x="0.13" y="0.106" width="0.04" height="0.01" fill="#fff" stroke-width="0.00019"/>

<!-- line-number leaders -->
<line x1="0.0726" y1="0.0522" x2="0.0726" y2="0.015" stroke-width="0.000125"/>
<polygon points="0.0726,0.0522 0.0735,0.05 0.0717,0.05" fill="#000" stroke-width="0.0001"/>
<line x1="0.1015" y1="0.0564" x2="0.1015" y2="0.026" stroke-width="0.000125"/>
<polygon points="0.1015,0.0564 0.1024,0.0542 0.1006,0.0542" fill="#000" stroke-width="0.0001"/>
<line x1="0.1568" y1="0.0936" x2="0.1506" y2="0.0936" stroke-width="0.000125"/>
<polygon points="0.1506,0.0936 0.1528,0.0945 0.1528,0.0927" fill="#000" stroke-width="0.0001"/>

<!-- tag leaders at the stub end -->
<g stroke="#555" stroke-width="0.0001">
<line x1="0.0315" y1="0.0768" x2="0.0338" y2="0.0722"/>
<line x1="0.0315" y1="0.0728" x2="0.0312" y2="0.0702"/>
<line x1="0.0315" y1="0.0688" x2="0.0312" y2="0.069"/>
<!-- leader from actuating-system bubble to the actuator -->
<line x1="0.0686" y1="0.06325" x2="0.0614" y2="0.0745"/>
</g>

<!-- instrument function ESV 3712: central location, panel D-13 -->
<rect x="0.012575" y="0.085575" width="0.01485" height="0.01485" stroke-width="0.00015"/>
<circle cx="0.02" cy="0.093" r="0.007425" stroke-width="0.00015"/>
<line x1="0.012575" y1="0.093" x2="0.027425" y2="0.093" stroke-width="0.00015"/>

<!-- same loop, actuating-system label bubble at the valve -->
<circle cx="0.0566" cy="0.082" r="0.007425" stroke-width="0.00015"/>

<!-- electric signal: ESV 3712 to actuator (dashed) -->
<polyline points="0.027425,0.093 0.0726,0.093 0.0726,0.0790" stroke-width="0.00015" stroke-dasharray="0.0009,0.0005"/>
<polygon points="0.0726,0.0768 0.0735,0.0790 0.0717,0.0790" fill="#000" stroke-width="0.0001"/>

<!-- ESD symbol feeding the same signal line -->
<polygon points="0.0726,0.1 0.0646,0.114 0.0646,0.1195 0.0806,0.1195 0.0806,0.114" stroke-width="0.00015"/>
<line x1="0.0646" y1="0.114" x2="0.0806" y2="0.114" stroke-width="0.00015"/>
<line x1="0.0726" y1="0.1" x2="0.0726" y2="0.096" stroke-width="0.00015" stroke-dasharray="0.0009,0.0005"/>
<polygon points="0.0726,0.093 0.0736,0.096 0.0716,0.096" fill="#000" stroke-width="0.0001"/>
</g>

<!-- text (pixel coordinates) -->
<g fill="#000">
<!-- stub end tags -->
<text x="248" y="390" text-anchor="end" font-size="12">PipeFitting-1 (plug)</text>
<text x="248" y="422" text-anchor="end" font-size="12">BlindFlange-1</text>
<text x="248" y="454" text-anchor="end" font-size="12">Flange-1</text>
<!-- run tags -->
<text x="552" y="584.5" text-anchor="end" font-size="12">Flange-2</text>
<text x="596" y="584.5" font-size="12">OperatedValve-1</text>
<text x="620" y="499" font-size="12">Flange-3</text>
<text x="864" y="496.5" text-anchor="middle" font-size="12">RestrictionOrifice-1</text>
<text x="931" y="608.5" text-anchor="middle" font-size="12">BallValve-1</text>
<text x="1012" y="608.5" font-size="12">PipeReducer-1</text>
<text x="1096" y="480.5" text-anchor="middle" font-size="12">0200x0800</text>
<!-- off-page connector -->
<text x="1200" y="116.5" text-anchor="middle" font-size="12">FlowOutPipeOffPageConnector-1</text>
<text x="1200" y="48" text-anchor="middle" font-size="11">to off-page, line 43L37007A</text>
<!-- line numbers -->
<text x="745" y="895" text-anchor="middle">D-13L37014A-0200PB-FD120-0F000N</text>
<text x="1040" y="808.5" text-anchor="middle">D-13L37007A-0200PB-FS720-0F000N</text>
<text x="1560" y="248.5" text-anchor="middle">D-43L37007A-0800VF-AS7F0-0F000N</text>
<!-- actuator -->
<text x="581" y="409" text-anchor="middle" font-size="15" font-weight="bold">M</text>
<text x="628" y="408.5" font-size="12">Electric actuator, fail action FB</text>
<!-- ESV 3712 bubble -->
<text x="160" y="232.5" text-anchor="middle" font-size="12">ESV</text>
<text x="160" y="275.7" text-anchor="middle" font-size="12">3712</text>
<text x="97" y="195" text-anchor="end" font-size="12">D-13</text>
<!-- actuating-system label bubble -->
<text x="453" y="320.5" text-anchor="middle" font-size="12">ESV</text>
<text x="453" y="363.7" text-anchor="middle" font-size="12">3712</text>
<text x="453" y="383" text-anchor="middle" font-size="10">D-13</text>
<!-- ESD symbol -->
<text x="509" y="47" text-anchor="end" font-size="12">D</text>
<text x="581" y="70.5" text-anchor="middle" font-size="12">ESD</text>
<!-- notes -->
<g font-size="11">
<text x="1000" y="900" font-weight="bold">DEXPI Example C03 - Equinor, Plant, area D (offshore module piping)</text>
<text x="1000" y="916">Heavy line: process pipe, flow left to right then up the riser to the off-page connector.</text>
<text x="1000" y="932">Dashed line: electric signal from ESV 3712 (and ESD) to the actuator of OperatedValve-1.</text>
<text x="1000" y="948">OperatedValve-1: electrically actuated (M), actuator fail action FB (code as in file).</text>
<text x="1000" y="964">ESV 3712: instrument function, central location, panel D-13.</text>
<text x="1000" y="980">Sizes 0200 / 0800 and line numbers as in the DEXPI file.</text>
</g>
</g>
</svg>
