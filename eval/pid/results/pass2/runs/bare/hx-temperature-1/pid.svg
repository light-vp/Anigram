<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Arial">
<rect width="1000" height="560" fill="#fff"/>
<text x="500" y="24" font-size="18" text-anchor="middle" font-weight="bold">P&amp;ID - Product Cooler E-201</text>

<!-- process lines -->
<g fill="none" stroke="#000" stroke-width="2">
<polyline points="90,280 300,280"/>
<polyline points="700,280 910,280"/>
<polyline points="910,440 620,440 620,320"/>
<polyline points="380,240 380,150 90,150"/>
<polyline points="520,240 520,175"/>
</g>
<!-- flow arrows -->
<g fill="#000">
<polygon points="300,280 290,275 290,285"/>
<polygon points="910,280 900,275 900,285"/>
<polygon points="620,320 615,330 625,330"/>
<polygon points="90,150 100,145 100,155"/>
<polygon points="520,175 515,185 525,185"/>
<polygon points="690,440 700,435 700,445"/>
</g>

<!-- exchanger -->
<rect x="330" y="240" width="340" height="80" fill="#fff" stroke="#000" stroke-width="2.5"/>
<rect x="300" y="245" width="30" height="70" fill="#fff" stroke="#000" stroke-width="2.5"/>
<rect x="670" y="245" width="30" height="70" fill="#fff" stroke="#000" stroke-width="2.5"/>
<g stroke="#000" stroke-width="1.5">
<line x1="330" y1="262" x2="670" y2="262"/>
<line x1="330" y1="280" x2="670" y2="280"/>
<line x1="330" y1="298" x2="670" y2="298"/>
</g>
<text x="500" y="345" font-size="13" text-anchor="middle" font-weight="bold">E-201  Product cooler (shell &amp; tube)</text>
<text x="500" y="361" font-size="10" text-anchor="middle">Tube side: hot product / Shell side: cooling water (counter-current)</text>
<text x="315" y="236" font-size="9" text-anchor="middle">TUBE IN</text>
<text x="685" y="236" font-size="9" text-anchor="middle">TUBE OUT</text>

<!-- HV-201 CW supply isolation -->
<polygon points="766,430 766,450 794,430 794,450" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="780" y="468" font-size="12" text-anchor="middle" font-weight="bold">HV-201</text>
<text x="780" y="482" font-size="10" text-anchor="middle">CW supply isolation</text>

<!-- HV-202 CW return isolation -->
<polygon points="370,181 390,181 370,209 390,209" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="396" y="193" font-size="12" font-weight="bold">HV-202</text>
<text x="396" y="207" font-size="10">CW return isolation</text>

<!-- TV-201 control valve with diaphragm actuator -->
<polygon points="186,140 186,160 214,140 214,160" fill="#fff" stroke="#000" stroke-width="2"/>
<line x1="200" y1="150" x2="200" y2="125" stroke="#000" stroke-width="2"/>
<path d="M188,125 A12,12 0 0 1 212,125 Z" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="200" y="182" font-size="12" text-anchor="middle" font-weight="bold">TV-201</text>
<text x="200" y="196" font-size="10" text-anchor="middle">CW return control valve</text>
<text x="200" y="210" font-size="10" text-anchor="middle">Fail open (FO)</text>

<!-- PSV-201 -->
<polygon points="510,215 530,215 510,235 530,235" fill="#fff" stroke="#000" stroke-width="2"/>
<polygon points="510,215 530,215 520,198" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="540" y="214" font-size="12" font-weight="bold">PSV-201</text>
<text x="540" y="228" font-size="10">Shell thermal relief</text>

<!-- TT-201 -->
<line x1="800" y1="280" x2="800" y2="212" stroke="#000" stroke-width="1.5"/>
<circle cx="800" cy="190" r="22" fill="#fff" stroke="#000" stroke-width="1.5"/>
<line x1="778" y1="190" x2="822" y2="190" stroke="#000" stroke-width="1.5"/>
<text x="800" y="186" font-size="12" text-anchor="middle" font-weight="bold">TT</text>
<text x="800" y="203" font-size="11" text-anchor="middle">201</text>
<text x="830" y="186" font-size="12" font-weight="bold">TT-201</text>
<text x="830" y="200" font-size="10">Product outlet temp.</text>

<!-- TIC-201 -->
<circle cx="650" cy="70" r="22" fill="#fff" stroke="#000" stroke-width="1.5"/>
<line x1="628" y1="70" x2="672" y2="70" stroke="#000" stroke-width="1.5"/>
<text x="650" y="66" font-size="12" text-anchor="middle" font-weight="bold">TIC</text>
<text x="650" y="83" font-size="11" text-anchor="middle">201</text>
<text x="650" y="38" font-size="11" text-anchor="middle">TIC-201 Product outlet temperature control</text>

<!-- signals -->
<g fill="none" stroke="#000" stroke-width="1.5" stroke-dasharray="6,4">
<polyline points="800,168 800,70 672,70"/>
<polyline points="628,70 200,70 200,113"/>
</g>
<polygon points="672,70 682,65 682,75" fill="#000"/>
<polygon points="200,113 195,103 205,103" fill="#000"/>
<text x="420" y="62" font-size="10" text-anchor="middle">signal</text>

<!-- off-sheet connectors -->
<g fill="#fff" stroke="#000" stroke-width="1.5">
<rect x="10" y="267" width="80" height="26"/>
<rect x="910" y="267" width="80" height="26"/>
<rect x="910" y="427" width="80" height="26"/>
<rect x="10" y="137" width="80" height="26"/>
<rect x="480" y="149" width="80" height="26"/>
</g>
<g font-size="12" text-anchor="middle" font-weight="bold">
<text x="50" y="284">OSC-201</text>
<text x="950" y="284">OSC-202</text>
<text x="950" y="444">OSC-203</text>
<text x="50" y="154">OSC-204</text>
<text x="520" y="166">OSC-205</text>
</g>
<g font-size="10" text-anchor="middle">
<text x="50" y="256">Hot product in</text>
<text x="950" y="256">To storage</text>
<text x="950" y="416">CW supply header</text>
<text x="50" y="126">CW return header</text>
<text x="520" y="140">PSV discharge - safe location</text>
</g>

<text x="500" y="525" font-size="10" text-anchor="middle">Solid = process line, dashed = instrument signal, OSC = off-sheet connector. TT-201 reads product outlet; TIC-201 throttles TV-201 on CW return.</text>
</svg>
