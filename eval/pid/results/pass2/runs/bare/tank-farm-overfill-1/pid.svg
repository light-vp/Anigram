<!-- common discharge header, pump, off-sheet -->
<polyline points="300,700 1102,700" fill="none" stroke="#000" stroke-width="2"/>
<line x1="500" y1="700" x2="535" y2="700" stroke="#000" stroke-width="2" marker-end="url(#kr)"/>
<line x1="980" y1="700" x2="1015" y2="700" stroke="#000" stroke-width="2" marker-end="url(#kr)"/>
<text x="330" y="720" font-size="11">COMMON DISCHARGE HEADER</text>
<circle cx="1130" cy="700" r="28" fill="#fff" stroke="#000" stroke-width="2"/>
<polygon points="1130,672 1154,712 1106,712" fill="none" stroke="#000" stroke-width="1.5" transform="rotate(90 1130 700)"/>
<polyline points="1130,672 1130,600 1284,600" fill="none" stroke="#000" stroke-width="2"/>
<text x="1130" y="750" font-size="14" font-weight="bold" text-anchor="middle">P-801</text>
<text x="1130" y="766" font-size="11" text-anchor="middle">Loading pump</text>
<polygon points="1284,600 1300,584 1358,584 1358,616 1300,616" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="1329" y="598" font-size="10" font-weight="bold" text-anchor="middle">OSC-2</text>
<text x="1329" y="611" font-size="9" text-anchor="middle">SH 1</text>
<text x="1284" y="570" font-size="11" font-weight="bold">TO LOADING RACK</text>

<!-- sequence notes -->
<rect x="1090" y="70" width="290" height="236" fill="#fafafa" stroke="#000"/>
<text x="1100" y="90" font-weight="bold">SEQUENCE SHOWN (TK-801 FIRST)</text>
<g font-size="11">
<text x="1100" y="110">1. Receipt enters TK-801 via XV-801.</text>
<text x="1100" y="128">2. TK-801 reaches HH: LSHH-811 trips.</text>
<text x="1100" y="146">3. LSHH-811 closes XV-801 by hardwired</text>
<text x="1100" y="160">    signal, independent of LT/LAH-801.</text>
<text x="1100" y="178">4. Receipt carries on via XV-802 into</text>
<text x="1100" y="192">    TK-802 (XV-802 open, about half full).</text>
<text x="1100" y="210">5. TK-803 idle: XV-803 closed, low level.</text>
<text x="1100" y="228">6. No tank is above its HH: no overflow.</text>
<text x="1100" y="248">Each LSHH-81x acts only on its own XV-80x.</text>
<text x="1100" y="266">XV-802 must be open before XV-801 closes,</text>
<text x="1100" y="280">so the pipeline is never dead-headed.</text>
</g>

<!-- legend -->
<rect x="40" y="790" width="860" height="50" fill="#fff" stroke="#000"/>
<line x1="55" y1="806" x2="105" y2="806" stroke="#000" stroke-width="2"/><text x="112" y="810" font-size="11">Process line</text>
<line x1="215" y1="806" x2="265" y2="806" stroke="#1565c0" stroke-width="4" marker-end="url(#ar)"/><text x="272" y="810" font-size="11">Active flow</text>
<line x1="375" y1="806" x2="425" y2="806" stroke="#000" stroke-width="1.3" stroke-dasharray="6,4"/><text x="432" y="810" font-size="11">Signal</text>
<polygon points="520,798 536,814 520,814 536,798" fill="#000" stroke="#000"/><text x="543" y="810" font-size="11">Closed valve</text>
<polygon points="640,798 656,814 640,814 656,798" fill="#fff" stroke="#000"/><text x="663" y="810" font-size="11">Open valve</text>
<text x="55" y="830" font-size="10">M = motor actuator. LT = level transmitter, LAH = level alarm high, LSHH = level switch high-high, XV = motor-operated valve, HV = manual isolating valve.</text>
</svg>
