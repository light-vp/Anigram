<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 960" width="1400" height="960" font-family="Arial, Helvetica, sans-serif">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#111"/></marker>
<marker id="arrs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1565c0"/></marker>
</defs>
<style>.proc{fill:none;stroke:#111;stroke-width:3}.sig{fill:none;stroke:#1565c0;stroke-width:1.5;stroke-dasharray:7 4}.sp{fill:none;stroke:#888;stroke-width:1;stroke-dasharray:4 3}</style>
<rect width="1400" height="960" fill="#fff"/>
<text x="30" y="34" font-size="20" font-weight="bold">WASTEWATER LIFT STATION – P&amp;ID</text>
<text x="30" y="54" font-size="12" fill="#444">Wet well WW-1501, submersible pumps P-1501A / P-1501B, lead/lag level control by the station PLC</text>
<g transform="translate(0,80)">

<!-- wet well -->
<rect x="150" y="200" width="300" height="380" fill="#fff" stroke="#111" stroke-width="3"/>
<rect x="151" y="450" width="298" height="129" fill="#cfe3f2"/>
<path d="M151,450 q18,-5 37,0 t37,0 t37,0 t37,0 t37,0 t37,0 t37,0 t37,0" fill="none" stroke="#4a8fc0" stroke-width="1.5"/>
<text x="300" y="600" font-size="13" text-anchor="middle" font-weight="bold">WW-1501  Wet well</text>

<!-- level set points -->
<path d="M152,290 H470" class="sp"/><text x="476" y="294" font-size="11" fill="#444">LAHH-1501  high-high alarm</text>
<path d="M152,335 H470" class="sp"/><text x="476" y="339" font-size="11" fill="#444">HIGH – lag pump starts</text>
<path d="M152,390 H470" class="sp"/><text x="476" y="394" font-size="11" fill="#444">START – lead pump starts</text>
<path d="M152,470 H470" class="sp"/><text x="476" y="474" font-size="11" fill="#444">STOP – pumps stop</text>

<!-- inlet -->
<path d="M70,250 H150" class="proc" marker-end="url(#arr)"/>
<path d="M30,236 H58 L70,250 L58,264 H30 Z" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="100" y="232" font-size="11" text-anchor="middle">Sewage, gravity inlet</text>
<text x="30" y="284" font-size="11">OSC-1501</text>

<!-- pumps -->
<circle cx="250" cy="530" r="22" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="250" y="535" font-size="15" text-anchor="middle" font-weight="bold">P</text>
<text x="222" y="534" font-size="11" text-anchor="end">P-1501A</text>
<circle cx="350" cy="530" r="22" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="350" y="535" font-size="15" text-anchor="middle" font-weight="bold">P</text>
<text x="378" y="534" font-size="11">P-1501B</text>

<!-- discharge -->
<path d="M250,508 V125 H549" class="proc"/>
<path d="M350,508 V175 H549" class="proc"/>
<circle cx="560" cy="125" r="11" fill="#fff" stroke="#111" stroke-width="1.5"/>
<path d="M555,119 L565,125 L555,131 Z M566,118 V132" fill="none" stroke="#111" stroke-width="1.5"/>
<text x="560" y="153" font-size="12" text-anchor="middle">CV-1501A</text>
<circle cx="560" cy="175" r="11" fill="#fff" stroke="#111" stroke-width="1.5"/>
<path d="M555,169 L565,175 L555,181 Z M566,168 V182" fill="none" stroke="#111" stroke-width="1.5"/>
<text x="560" y="203" font-size="12" text-anchor="middle">CV-1501B</text>
<path d="M571,125 H668" class="proc"/>
<path d="M571,175 H668" class="proc"/>
<path d="M668,116 L692,134 L692,116 L668,134 Z" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="680" y="153" font-size="12" text-anchor="middle">HV-1501A</text>
<path d="M668,166 L692,184 L692,166 L668,184 Z" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="680" y="203" font-size="12" text-anchor="middle">HV-1501B</text>
<path d="M692,125 H800 V175 M692,175 H800" class="proc"/>
<path d="M800,150 H1000" class="proc" marker-end="url(#arr)"/>
<path d="M1000,136 H1030 L1044,150 L1030,164 H1000 Z" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="1056" y="147" font-size="11">OSC-1502</text>
<text x="1056" y="161" font-size="11">To rising main (off sheet)</text>
<text x="810" y="143" font-size="11">Common rising main</text>

<!-- level transmitter -->
<path d="M102,440 H150" class="proc" style="stroke-width:1.5"/>
<circle cx="80" cy="440" r="22" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="80" y="437" font-size="12" text-anchor="middle" font-weight="bold">LT</text>
<text x="80" y="452" font-size="11" text-anchor="middle">1501</text>
<text x="80" y="408" font-size="10" text-anchor="middle">LT-1501</text>

<!-- PLC -->
<rect x="520" y="650" width="240" height="80" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="640" y="680" font-size="15" text-anchor="middle" font-weight="bold">PLC-1501</text>
<text x="640" y="700" font-size="11" text-anchor="middle">Station PLC – lead/lag level control</text>
<text x="640" y="716" font-size="11" text-anchor="middle">and high-high alarm</text>
<path d="M80,462 V690 H519" class="sig" marker-end="url(#arrs)"/>
<text x="90" y="682" font-size="10" fill="#1565c0">level signal</text>
<path d="M560,650 V620 H250 V554" class="sig" marker-end="url(#arrs)"/>
<path d="M350,620 V554" class="sig" marker-end="url(#arrs)"/>
<text x="420" y="612" font-size="10" fill="#1565c0">start / stop commands</text>
<path d="M760,690 H876" class="sig" marker-end="url(#arrs)"/>
<circle cx="900" cy="690" r="22" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="900" y="687" font-size="12" text-anchor="middle" font-weight="bold">LAHH</text>
<text x="900" y="702" font-size="11" text-anchor="middle">1501</text>
<text x="900" y="728" font-size="10" text-anchor="middle">LAHH-1501 high-high level alarm</text>

<!-- trend -->
<text x="900" y="246" font-size="12" font-weight="bold">Illustrative wet well level over 24 h (not to scale)</text>
<rect x="900" y="280" width="360" height="200" fill="#fafafa" stroke="#999"/>
<rect x="1095" y="280" width="93" height="200" fill="#ffe9c7"/>
<rect x="900" y="280" width="90" height="200" fill="#e6eefc"/>
<path d="M900,283 H1260" stroke="#c62828" stroke-width="1.5"/>
<text x="1265" y="287" font-size="10" fill="#c62828">Overflow level</text>
<path d="M900,320 H1260" class="sp"/><text x="1265" y="324" font-size="10" fill="#444">LAHH-1501</text>
<path d="M900,370 H1260" class="sp"/><text x="1265" y="374" font-size="10" fill="#444">HIGH (lag start)</text>
<path d="M900,420 H1260" class="sp"/><text x="1265" y="424" font-size="10" fill="#444">START (lead)</text>
<path d="M900,470 H1260" class="sp"/><text x="1265" y="474" font-size="10" fill="#444">STOP</text>
<polyline points="900,455 922.5,420 927.75,470 949.5,420 954.75,470 976.5,420 981.75,470 999,420 1004.25,470 1020,420 1025.25,470 1039.5,420 1044.75,470 1057.5,420 1062.75,470 1074,420 1079.25,470 1095,440 1102.5,420 1114.5,370 1128,348 1143,345 1162.5,385 1177.5,435 1188,470 1215,420 1220.25,470 1248,420 1253.25,470 1260,458" fill="none" stroke="#0d47a1" stroke-width="2"/>
<text x="903" y="297" font-size="9">Overnight: pumps</text>
<text x="903" y="308" font-size="9">stop between cycles</text>
<text x="1098" y="297" font-size="9">Storm: both</text>
<text x="1098" y="308" font-size="9">pumps run</text>

<text x="895" y="504" font-size="10" text-anchor="end">P-1501A run</text>
<rect x="900" y="495" width="360" height="10" fill="#eee" stroke="#bbb" stroke-width="0.5"/>
<g fill="#2e7d32">
<rect x="922.5" y="495" width="5.25" height="10"/><rect x="949.5" y="495" width="5.25" height="10"/><rect x="976.5" y="495" width="5.25" height="10"/><rect x="999" y="495" width="5.25" height="10"/><rect x="1020" y="495" width="5.25" height="10"/><rect x="1039.5" y="495" width="5.25" height="10"/><rect x="1057.5" y="495" width="5.25" height="10"/><rect x="1074" y="495" width="5.25" height="10"/>
<rect x="1102.5" y="495" width="85.5" height="10"/><rect x="1215" y="495" width="5.25" height="10"/><rect x="1248" y="495" width="5.25" height="10"/>
</g>
<text x="895" y="524" font-size="10" text-anchor="end">P-1501B run</text>
<rect x="900" y="515" width="360" height="10" fill="#eee" stroke="#bbb" stroke-width="0.5"/>
<rect x="1114.5" y="515" width="73.5" height="10" fill="#2e7d32"/>
<path d="M900,530 v5 M990,530 v5 M1080,530 v5 M1170,530 v5 M1260,530 v5" stroke="#111"/>
<text x="900" y="548" font-size="10" text-anchor="middle">00:00</text>
<text x="990" y="548" font-size="10" text-anchor="middle">06:00</text>
<text x="1080" y="548" font-size="10" text-anchor="middle">12:00</text>
<text x="1170" y="548" font-size="10" text-anchor="middle">18:00</text>
<text x="1260" y="548" font-size="10" text-anchor="middle">24:00</text>
<text x="1080" y="564" font-size="10" text-anchor="middle">Storm: level passes HIGH, lag pump joins, level peaks below LAHH-1501</text>

<!-- notes -->
<rect x="30" y="765" width="1340" height="100" fill="#f6f6f6" stroke="#999"/>
<text x="42" y="786" font-size="13" font-weight="bold">Control logic (PLC-1501, from LT-1501)</text>
<text x="42" y="806" font-size="12">1. Lead pump starts at the START level and stops at the STOP level.</text>
<text x="42" y="824" font-size="12">2. Lag pump starts on HIGH level (both pumps stop at the STOP level).</text>
<text x="42" y="842" font-size="12">3. LAHH-1501 raises a high-high level alarm. Set-point values were not given and are not shown.</text>
<text x="800" y="806" font-size="12" font-weight="bold">Legend:</text>
<path d="M860,802 H920" class="proc"/><text x="930" y="806" font-size="12">process pipe</text>
<path d="M1040,802 H1100" class="sig"/><text x="1110" y="806" font-size="12">instrument / control signal</text>
</g>
</svg>
