<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" width="820" height="560" font-family="Arial, sans-serif" font-size="12">
  <rect width="820" height="560" fill="#fff"/>
  <text x="410" y="22" text-anchor="middle" font-size="16" font-weight="bold">Pressure measurement P&amp;ID - loops 044 / 045 / 046 / 047</text>

  <!-- control room band -->
  <rect x="20" y="40" width="780" height="270" fill="#f4f8fc" stroke="#357" stroke-dasharray="8 4"/>
  <text x="30" y="58" fill="#357" font-weight="bold">CONTROL ROOM (central location)</text>
  <text x="30" y="328" fill="#357" font-weight="bold">FIELD</text>
  <line x1="20" y1="310" x2="800" y2="310" stroke="#357" stroke-width="2"/>

  <!-- process pipe -->
  <line x1="40" y1="450" x2="780" y2="450" stroke="#000" stroke-width="3"/>
  <text x="46" y="440">Process line (PipingNetworkSegment-1)</text>
  <polygon points="760,443 776,450 760,457" fill="#000"/>

  <!-- tapping points -->
  <circle cx="200" cy="450" r="4" fill="#000"/>
  <circle cx="400" cy="450" r="4" fill="#000"/>
  <text x="208" y="472">ProcessSignalGeneratingFunction-2</text>
  <text x="408" y="492">ProcessSignalGeneratingFunction-1</text>

  <!-- measuring lines (thin solid) -->
  <line x1="200" y1="446" x2="200" y2="384" stroke="#000" stroke-width="1.2"/>
  <line x1="400" y1="446" x2="400" y2="192" stroke="#000" stroke-width="1.2"/>

  <!-- PI-045 field gauge -->
  <circle cx="200" cy="354" r="30" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="200" y="352" text-anchor="middle" font-weight="bold">PI</text>
  <text x="200" y="368" text-anchor="middle" font-weight="bold">045</text>
  <text x="200" y="404" text-anchor="middle" x-dummy="">PI-045 local gauge</text>

  <!-- PI-044 control-room indication (line through bubble = central location) -->
  <circle cx="400" cy="160" r="30" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <line x1="370" y1="160" x2="430" y2="160" stroke="#000"/>
  <text x="400" y="155" text-anchor="middle" font-weight="bold">PI</text>
  <text x="400" y="175" text-anchor="middle" font-weight="bold">044</text>
  <text x="400" y="118" text-anchor="middle">PI-044 pressure indication</text>

  <!-- switches -->
  <circle cx="680" cy="88" r="30" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <line x1="650" y1="88" x2="710" y2="88" stroke="#000"/>
  <text x="680" y="83" text-anchor="middle" font-weight="bold">US</text>
  <text x="680" y="103" text-anchor="middle" font-weight="bold">046</text>
  <text x="680" y="130" text-anchor="middle">US-046</text>
  <text x="680" y="144" text-anchor="middle">switch: high / low</text>

  <circle cx="680" cy="230" r="30" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <line x1="650" y1="230" x2="710" y2="230" stroke="#000"/>
  <text x="680" y="225" text-anchor="middle" font-weight="bold">US</text>
  <text x="680" y="245" text-anchor="middle" font-weight="bold">047</text>
  <text x="680" y="276" text-anchor="middle">US-047</text>
  <text x="680" y="290" text-anchor="middle">switch: high-high / low-low</text>

  <!-- signal lines (dashed) from PI-044 -->
  <g fill="none" stroke="#000" stroke-dasharray="6 3" stroke-width="1.3">
    <polyline points="429,150 500,150 500,78 650,78"/>
    <polyline points="430,160 540,160 540,98 650,98"/>
    <polyline points="429,172 540,172 540,220 650,220"/>
    <polyline points="425,182 500,182 500,242 650,242"/>
  </g>
  <g font-weight="bold" fill="#a00">
    <text x="575" y="72" text-anchor="middle">H (high)</text>
    <text x="595" y="114" text-anchor="middle">L (low)</text>
    <text x="595" y="214" text-anchor="middle">HH (high-high)</text>
    <text x="575" y="258" text-anchor="middle">LL (low-low)</text>
  </g>

  <!-- legend -->
  <g transform="translate(20,515)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#000" stroke-width="3"/><text x="48" y="4">process pipe</text>
    <line x1="170" y1="0" x2="210" y2="0" stroke="#000" stroke-width="1.2"/><text x="218" y="4">measuring (impulse) line</text>
    <line x1="400" y1="0" x2="440" y2="0" stroke="#000" stroke-dasharray="6 3" stroke-width="1.3"/><text x="448" y="4">signal line (status of switching function)</text>
  </g>
</svg>
